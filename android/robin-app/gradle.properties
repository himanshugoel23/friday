org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=false
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---- Build properties (override with -Probin.applicationId=... on the command line or in CI) ----
# Application id (package name of the installed app). PLACEHOLDER until the Play account and the final id exist.
robin.applicationId=app.robin.parent
# Product name shown on the phone and in the widget. Pilot value "Robin"; the server also sends the brand at pairing.
robin.brandName=Robin
# Server base URL, no trailing slash. PLACEHOLDER: ".invalid" never resolves, so an unconfigured build cannot call anything.
robin.baseUrl=https://robin-server.invalid
robin.versionName=0.1.0
robin.versionCode=1
