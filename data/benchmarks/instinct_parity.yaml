# Instinct parity benchmark.
# Generalised from what real users ask Instinct. NO personal data: neutral fixtures only
# (Sector 39, Sonipat, "mummy", invented numbers). Run: `friday bench run [--scenario ID] [--fake]`.
#
# Per scenario: id, category, capability, messages (multi-turn allowed; rules judge the LAST reply),
# user (hinglish = Roman Hinglish tester, english = English tester), rules (checkable, see
# friday/bench/rules.py), expected_today (works | needs connector | not built).
# Status: all rules hold = PASS; a "needs connector" scenario that fails but honestly says what it
# needs = NEEDS-CONNECTOR; anything else = FAIL.
scenarios:
  - id: gmail_check
    category: email
    capability: email
    messages: ["Mera gmail check krna"]
    expected_today: needs connector
    rules: [not_flat_refusal, states_need_or_alternative, max_one_question, mirrors_roman_script, has_next_step]

