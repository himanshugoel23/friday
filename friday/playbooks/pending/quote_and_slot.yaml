# PENDING v7 (founder script review 13 Oct 2026; same flow as salon_booking v7).
# PENDING playbook: quote_and_slot (archetype A). NOT loaded by production (`select`, calls).
# Lives in friday/playbooks/pending/ until the founder has HEARD the audio and approved it
# (hear-before-change). Promote only with: friday playbook promote quote_and_slot
# (needs the founder's marker file quote_and_slot.approved next to this file).
#
# One call shape for every "ask the price, optionally ask a slot" vendor: salon-like businesses,
# spa, clinic/doctor fees and appointment, dentist, diagnostic lab, physio, gym trial, car wash,
# car/bike service, laundry pickup, tutor demo, vet, makeup artist... The category pack
# (friday/vendors/categories/quote_and_slot.yaml) only changes the VOCABULARY: what the user
# wants (`services`), the sane price range, and which category it is. The words below do not change.
#
# Same rules as salon_booking v6 (founder): identity question first, then "virtual assistant" and
# the purpose, price FIRST, no negotiation unless the owner said so, no advance / cancellation
# question unless the vendor raises it, AI answered truthfully on request, booking ONLY with a
# delegation and the code-level commit check. Modes: quote_only (default) | book.
# Extra for vendors: "aake dekhna padega" (visit needed) and "WhatsApp pe bhej do" are handled.

version: 1
id: quote_and_slot
archetype: quote_and_slot
title: Quote and slot (clinic, dentist, gym trial, car wash, laundry, tutor demo, ...)
language: hinglish

inputs:
  user_first_name: {required: true}
  user_spoken: {}
  honorific: {default: sir}
  business_name: {required: true}
  business_name_spoken: {}
  service: {required: true}
  services: {}
  services_spoken: {}
  playbook_mode: {default: quote_only}
  date_window: {}
  fallback_when: {}
  fallback_day: {}
  budget: {}
  price_min: {}              # category sanity range: a price outside it is not trusted
  price_max: {}
  category: {}
  price_word: {default: charges}   # clinic / vet: fees (category pack)
  q_appointment: {default: "no"}   # clinic: say "appointment" instead of "slot"
  user_full_name: {}
  user_full_spoken: {}
  negotiate: {default: "no"}
  explore_options: {default: "no"}

outputs: [slot_free, offered_slots, slot, price_inr, price_low_inr, price_unit, advance_needed, visit_needed, whatsapp_requested, outcome]

limits:
  max_duration_s: 180
  max_repeats: 4
  max_unclear_per_step: 2
  hold_max_s: 60
  max_turns: 30

disclosure: disclosure
ai_disclosure: on_request
reintro: reintro

confusion:
  line: sorry
  outcome: UNCLEAR
  close: bye_unclear

lines:
  disclosure: "Hello, kya meri baat {business_name_spoken} se ho rahi hai?"
  reintro: "Ji, main Friday hoon, {user_spoken} {honorific} ki virtual assistant."
  s0_who: "Ji, main Friday hoon, {user_spoken} {honorific} ki virtual assistant. Kya meri baat {business_name_spoken} se ho rahi hai?"
  recording_notice: "Yeh call quality ke liye record ho sakta hai."
  # the HOOK: one short line, the purpose of the call, then WAIT for "haan ji, bataiye"
  intro: "Ji sir, actually maine aapko {services_spoken} ke regarding call kiya tha."
  s3_ask_first: "Toh sir, {services_spoken} ke estimated kya {price_word} rahenge?"
  s3_ask: "Sir, {services_spoken} ke estimated kya {price_word} rahenge?"
  ai_yes: "Ji, haan, main {user_spoken} {honorific} ki personal AI assistant hoon."
  bye_busy: "Ji koi baat nahi, main baad mein call karti hoon. Shukriya."
  bye_wrong: "Ji maaf kijiye, galat number lag gaya. Shukriya."
  bye_dnc: "Ji theek hai, hum dobara call nahi karenge. Shukriya."
  bye_rude: "Ji maaf kijiye, pareshan karne ke liye. Shukriya."
  bye_unclear: "Ji maaf kijiye, awaaz saaf nahi aa rahi. Main baad mein call karti hoon. Shukriya."
  s3b_ask: "{user_spoken} {honorific} ka budget {budget} rupaye hai. Kuch kam ho sakta hai?"
  wa_decline: "Achha sir, abhi WhatsApp possible nahi hai, aap yahin bata dijiye please."
  s3r_ask: "Achha, toh koi estimated range bata sakte hain?"
  s2_ask_first: "Achha theek hai sir, toh {date_window} ka slot booking ke liye aapke paas available hoga?"
  s2_ask_first_appt: "Achha theek hai sir, toh {date_window} ki appointment aapke paas available hogi?"
  s2_ask: "Toh sir, {date_window} ka slot aapke paas available hoga?"
  s2_ask_appt: "Toh sir, {date_window} ki appointment aapke paas available hogi?"
  s2_appt_only: "Achha, appointment ke liye hi poochh rahi hoon."
  s2_ask_time: "Kitne baje ka?"
  s2f_ask: "Achha, nahi ho sakta. Toh kya {fallback_day} ka slot available hoga?"
  s2f_ask_appt: "Achha, nahi ho sakta. Toh kya {fallback_day} ki appointment available hogi?"
  s2b_ask: "Achha okay. Toh koi {date_window} ke around ka slot available ho?"
  s2b_ask_appt: "Achha okay. Toh koi {date_window} ke around ki appointment available ho?"
  s2b_ask_two: "Achha okay. Toh koi {date_window} ke around ke do slot available hain?"
  s2n_ask: "Toh sabse nearest kaun sa slot available hoga?"
  s2n_ask_appt: "Toh sabse nearest kaun si appointment available hogi?"
  s2b_none: "Achha theek hai sir, main {user_spoken} {honorific} se confirm karke aapko thodi der mein call back karti hoon. Thank you."
  s5_no_advance: "Achha, advance main abhi nahi de sakti, {user_spoken} {honorific} se poochh kar bataungi."
  no_number: "Ji, {user_spoken} {honorific} ka number main share nahi kar sakti."
  s7_close: "Achha theek hai sir, main {user_spoken} {honorific} se confirm karke aapko thodi der mein call back karti hoon. Thank you."
  s7_commit_free:
    text: "Achha theek hai sir, toh aap {slot} ka booking {user_full_spoken} ke naam se book kar lijiye. {slot_time} se pehle main ek baar confirmation ke liye call kar lungi. Thank you."
    commit: true
  s7_commit_fallback:
    text: "Achha theek hai sir, toh aap {slot} ka booking {user_full_spoken} ke naam se book kar lijiye. {slot_time} se pehle main ek baar confirmation ke liye call kar lungi. Thank you."
    commit: true
  q_close: "Achha theek hai sir, main ek baar {user_spoken} {honorific} ko bata deti hoon, aur thodi der mein aapko confirm karke batati hoon."
  sorry: "Sorry, ek baar phir?"
  offscript: "Achha, yeh main {user_spoken} {honorific} se poochh kar bataungi."
  no_secrets: "Ji, yeh jaankari main share nahi kar sakti."

routes:
  after_quote:
    - {when: [over_budget, may_negotiate, mode_book], goto: S3b}
    - {when: [mode_quote], goto: S7q}
    - {goto: S2}
  after_price:
    - {when: [mode_quote], goto: S7q}
    - {goto: S2}

defaults:
  STOP_CALLING: {say: [bye_dnc], outcome: REFUSED, set: {do_not_call: "yes"}}
  RUDE: {say: [bye_rude], outcome: REFUSED, set: {rude: "yes"}}
  WRONG_NUMBER: {say: [bye_wrong], outcome: WRONG_NUMBER, set: {wrong_number: "yes"}}
  BUSY_LATER: {say: [bye_busy], outcome: CALL_BACK_LATER}
  NEEDS_ADVANCE:
    - {when: [slot_known], say: [s5_no_advance], set: {advance_needed: "yes"}, outcome: SLOT_OFFERED}
    - {say: [s5_no_advance], set: {advance_needed: "yes"}, outcome: ADVANCE_ASKED}
  NO_ADVANCE: {set: {advance_needed: "no"}, repeat: true, max_uses: 2}
  ARE_YOU_BOT: {say: [ai_yes], repeat: true}
  WHO_IS_THIS:
    - {say: [reintro, intro], repeat: true, max_uses: 1}
    - {say: [intro], repeat: true, max_uses: 1}
  ASKS_REPEAT: {repeat: true, max_uses: 3}
  HOLD_ON: {hold_s: 60, max_uses: 3}
  ASKS_OFFTOPIC: {say: [offscript], repeat: true, max_uses: 3}
  ASKS_SECRET: {say: [no_secrets], repeat: true, max_uses: 2}
  ASKS_CUSTOMER_PHONE: {say: [no_number], repeat: true, max_uses: 2}
  # "WhatsApp pe bhej do": asked once to say it here (S3), then the call closes politely
  WHATSAPP_PLEASE: {set: {whatsapp_requested: "yes"}, goto: S7w}
  VISIT_NEEDED: {set: {visit_needed: "yes"}, goto: S3r}

start: S0
commit_step: S7

steps:
  S0:
    branches:
      YES: {goto: S1}
      CONTINUE: {goto: S1}
      ACK: {goto: S1}
      NO: {say: [bye_wrong], outcome: WRONG_NUMBER, set: {wrong_number: "yes"}}
      WHO_IS_THIS: {say: [s0_who], stay: true, max_uses: 2}
      ASKS_REPEAT: {say: [s0_who], stay: true, max_uses: 2}
      ARE_YOU_BOT: {say: [ai_yes], goto: S1}
      ASKS_OFFTOPIC: {say: [s0_who], stay: true}
      ASKS_SECRET: {say: [s0_who], stay: true}
      ASKS_CUSTOMER_PHONE: {say: [s0_who], stay: true}
      WHATSAPP_PLEASE: {say: [s0_who], stay: true, max_uses: 1}
      VISIT_NEEDED: {say: [s0_who], stay: true, max_uses: 1}

  S1:   # the HOOK: the purpose of the call in ONE short line; then wait for "haan ji, bataiye"
    ask: [intro]
    branches:
      YES: {goto: S3}
      CONTINUE: {goto: S3}
      ACK: {goto: S3}
      ASKS_REPEAT: {repeat: true, max_uses: 1}
      GIVES_PRICE:
        - {when: [price_known], goto: "@after_quote"}
        - {goto: S3}
      ANY: {goto: S3}

  S3:   # the PRICE question; the hook was already said in S1
    ask:
      - {line: recording_notice, when: [recording, first_ask]}
      - {line: s3_ask_first, when: [first_ask]}
      - {line: s3_ask, when: ["!first_ask"]}
    branches:
      GIVES_PRICE:
        - {when: [price_known], goto: "@after_quote"}
        - {repeat: true}
      PRICE_RANGE:
        - {when: [price_known], goto: "@after_quote"}
        - {repeat: true}
      NO_CHARGE: {set: {price_free: "yes"}, goto: "@after_price"}
      PRICE_DEPENDS: {set: {price_note: depends}, goto: "@after_price"}
      VISIT_NEEDED: {set: {visit_needed: "yes"}, goto: S3r}
      REFUSES_PRICE: {set: {price_unknown: "yes"}, goto: "@after_price"}
      WHATSAPP_PLEASE: {say: [wa_decline], repeat: true, max_uses: 1}
      CONTINUE: {repeat: true}
      YES: {repeat: true}
      ASKS_REPEAT: {repeat: true, max_uses: 2}

  S3r:  # no price on the phone (visit needed): ask for a rough range ONCE, then close
    max_visits: 1
    ask: [s3r_ask]
    branches:
      GIVES_PRICE:
        - {when: [price_known], goto: S7v}
        - {goto: S7v}
      PRICE_RANGE:
        - {when: [price_known], goto: S7v}
        - {goto: S7v}
      ANY: {goto: S7v}

  S3b:  # over budget AND the owner allowed negotiating (book mode): ask once, accept either way
    max_visits: 1
    ask: [s3b_ask]
    branches:
      GIVES_PRICE: {goto: "@after_price"}
      PRICE_RANGE: {goto: "@after_price"}
      YES: {goto: "@after_price"}
      NO: {goto: "@after_price"}
      ANY: {goto: "@after_price"}

  S2:   # book mode: the slot
    ask:
      - {line: s2_ask_first, when: [first_ask, "!q_appointment"]}
      - {line: s2_ask_first_appt, when: [first_ask, q_appointment]}
      - {line: s2_ask, when: ["!first_ask", "!q_appointment"]}
      - {line: s2_ask_appt, when: ["!first_ask", q_appointment]}
    branches:
      SLOT_FREE:
        - {when: [slot_known], goto: S7}
        - {goto: S2t}
      YES:
        - {when: [has_requested_time], use_requested_time: true, goto: S7}
        - {goto: S2t}
      GIVES_TIME: {goto: S7}
      OFFERS_SLOTS: {goto: S7}
      SLOT_BUSY:
        - {when: [has_fallback], goto: S2f}
        - {goto: S2b}
      NO:
        - {when: [has_fallback], goto: S2f}
        - {goto: S2b}
      NEEDS_APPOINTMENT: {say: [s2_appt_only], repeat: true, max_uses: 1}
      CONTINUE: {repeat: true}
      ASKS_REPEAT: {repeat: true, max_uses: 2}

  S2t:
    ask: [s2_ask_time]
    branches:
      GIVES_TIME: {goto: S7}
      SLOT_FREE:
        - {when: [slot_known], goto: S7}
        - {repeat: true}
      OFFERS_SLOTS: {goto: S7}
      SLOT_BUSY: {goto: S2b}
      NO: {goto: S2b}

  S2f:
    day_input: fallback_when
    max_visits: 1
    ask:
      - {line: s2f_ask, when: ["!q_appointment"]}
      - {line: s2f_ask_appt, when: [q_appointment]}
    branches:
      SLOT_FREE:
        - {when: [slot_known], goto: S7}
        - {when: [has_fallback], use_fallback_time: true, set: {fallback_used: "yes"}, goto: S7}
        - {goto: S2b}
      YES:
        - {when: [has_fallback], use_fallback_time: true, set: {fallback_used: "yes"}, goto: S7}
        - {goto: S2b}
      GIVES_TIME: {goto: S7}
      OFFERS_SLOTS: {goto: S7}
      SLOT_BUSY: {goto: S2b}
      NO: {goto: S2b}
      ANY: {goto: S2b}

  S2b:  # nothing suits: ask for a slot AROUND the asked time; Friday never books a different time
    ask:
      - {line: s2b_ask_two, when: [explore_options]}
      - {line: s2b_ask, when: ["!explore_options", "!q_appointment"]}
      - {line: s2b_ask_appt, when: ["!explore_options", q_appointment]}
    branches:
      OFFERS_SLOTS:
        - {when: [slot_known], set: {alt_offered: "yes"}, goto: S7}
        - {repeat: true}
      SLOT_FREE:
        - {when: [slot_known], set: {alt_offered: "yes"}, goto: S7}
        - {goto: S2n}
      GIVES_TIME:
        - {when: [slot_known], set: {alt_offered: "yes"}, goto: S7}
        - {repeat: true}
      SLOT_BUSY: {goto: S2n}
      NO: {goto: S2n}

  S2n:  # nothing around that time either: the nearest slot that exists (any day); still not booked
    max_visits: 1
    ask:
      - {line: s2n_ask, when: ["!q_appointment"]}
      - {line: s2n_ask_appt, when: [q_appointment]}
    branches:
      OFFERS_SLOTS: {set: {alt_offered: "yes"}, goto: S7}
      SLOT_FREE:
        - {when: [slot_known], set: {alt_offered: "yes"}, goto: S7}
        - {say: [s2b_none], outcome: NO_SLOT}
      GIVES_TIME: {set: {alt_offered: "yes"}, goto: S7}
      SLOT_BUSY: {say: [s2b_none], outcome: NO_SLOT}
      NO: {say: [s2b_none], outcome: NO_SLOT}
      ANY: {say: [s2b_none], outcome: NO_SLOT}

  S7:   # book-mode close
    final: true
    branches:
      ANY:
        - {when: [can_commit, used_fallback, "!alt_offered"], say: [s7_commit_fallback], commit: true, outcome: BOOKED}
        - {when: [can_commit, "!alt_offered"], say: [s7_commit_free], commit: true, outcome: BOOKED}
        - {when: [slot_known], say: [s7_close], outcome: SLOT_OFFERED}
        - {say: [bye_unclear], outcome: UNCLEAR}

  S7q:  # quote-only close
    final: true
    branches:
      ANY:
        - {when: [price_known], say: [q_close], outcome: QUOTE_COLLECTED}
        - {say: [q_close], outcome: PRICE_ON_REQUEST}

  S7v:  # they cannot quote without seeing it
    final: true
    branches:
      ANY:
        - {when: [price_known], say: [q_close], outcome: QUOTE_COLLECTED}
        - {say: [q_close], outcome: NEEDS_VISIT}

  S7w:  # they asked to send it on WhatsApp
    final: true
    branches:
      ANY:
        - {when: [price_known], say: [q_close], outcome: QUOTE_COLLECTED}
        - {say: [q_close], outcome: WHATSAPP_REQUESTED}

outcomes:
  QUOTE_COLLECTED:
    call_outcome: partial
    description: price collected (price_inr, price_low_inr, price_unit), nothing booked
    needs_quote: true
  SLOT_OFFERED:
    call_outcome: pending_approval
    description: price and slot collected, awaiting the user's approval
    needs_quote: true
  BOOKED:
    call_outcome: success
    description: booked under the user's delegation
    needs_quote: true
  NO_SLOT:
    call_outcome: declined
    description: nothing free
  CALL_BACK_LATER:
    call_outcome: callback_later
    description: they asked us to call later
  WRONG_NUMBER:
    call_outcome: declined
    description: wrong number / not this kind of business
    collected: {wrong_number: "yes"}
  NEEDS_VISIT:
    call_outcome: partial
    description: they cannot give a price without seeing it (visit needed)
    collected: {visit_needed: "yes"}
  WHATSAPP_REQUESTED:
    call_outcome: partial
    description: they wanted to send details on WhatsApp instead of saying them
    collected: {whatsapp_requested: "yes"}
  PRICE_ON_REQUEST:
    call_outcome: partial
    description: no price on the phone / it depends
  ADVANCE_ASKED:
    call_outcome: partial
    description: they asked for an advance; Friday did not agree
  UNCLEAR:
    call_outcome: partial
    description: could not understand them
  REFUSED:
    call_outcome: declined
    description: asked not to be called again, or hostile (no retry)
  NO_ANSWER:
    call_outcome: no_answer
    description: nobody picked up (set by the call runner)
