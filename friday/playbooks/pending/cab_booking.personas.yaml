# Simulated cab operators for `friday playbook dry-run cab_booking --pending`.
# Format: see quote_and_slot.personas.yaml (replies are keyed by the PLAYBOOK LINE ID Friday last
# spoke; a list is used in order; a reply may be {say, hold_s, then, hangup, silence}).
# `mode: negotiate` / `mode: confirm` in a brief = the callback call (needs the dry-run mode hook).
# `preview_*` personas feed `friday playbook preview cab_booking --pending` (audio for the founder).

version: 1
playbook: cab_booking

brief:
  user_first_name: Rahul
  honorific: sir
  services: "cab"
  business_name: "City Cabs"
  category: cab_travel
  price_min: 5
  price_max: 100000
  from_place: "Noida"
  to_place: "Jaipur"
  pickup_time: "kal subah 6 baje"
  people_count: "4"
  user_full_name: "Rahul Sharma"

personas:
  - id: preview_first_call
    title: "Founder audio: the first call, toll not included"
    greeting: "Hello, City Cabs."
    default: "Ji haan, woh sab theek hai"
    replies:
      s3_ask: "Total 12000 rupaye lagega"
      s4_ask: "Swift Dzire milegi"
      s5_ask: "Nahi, toll alag se lagega"
      s5t_ask: "Toll lagbhag 800 rupaye"
      s6_ask: "Haan ho jayegi"
    expect: {outcome: QUOTE_COLLECTED}

  - id: preview_callback_negotiate
    title: "Founder audio: callback, push 1 then push 2"
    greeting: "Hello, City Cabs."
    default: "Ji haan, woh sab theek hai"
    brief: {mode: negotiate, resume: "yes", prior_price_inr: "12000", target_price: "10000", max_price: "11000"}
    replies:
      push1: "Nahi, 12000 se kam nahi hoga"
      push2: "Theek hai, 10500 kar dete hain"
    expect: {outcome: PRICE_AGREED}

  - id: preview_callback_confirm
    title: "Founder audio: callback, finalise, WhatsApp number read back"
    greeting: "Hello, City Cabs."
    default: "Ji haan, woh sab theek hai"
    brief: {mode: confirm, resume: "yes", prior_price_inr: "11000", prior_slot: "kal subah 6 baje", date_window: "kal subah 6 baje", delegation_max_price: 12000}
    replies:
      cab_wa_ask: "98111 22334"
      wa_readback: "Haan ji sahi hai"
    expect: {outcome: BOOKED}

  - id: all_included
    title: "Everything is included: no toll question"
    greeting: "Hello, City Cabs."
    default: "Ji haan, woh sab theek hai"
    replies:
      s3_ask: "Total 12000 rupaye, sab kuch include hai"
      s4_ask: "Innova milegi"
      s5_ask: "Haan sab include hai"
      s6_ask: "Haan available hai"
    expect: {outcome: QUOTE_COLLECTED}

  - id: price_range
    title: "A price range"
    greeting: "Hello, City Cabs."
    default: "Ji haan, woh sab theek hai"
    replies:
      s3_ask: "11000 se 13000 rupaye tak"
    expect: {outcome: QUOTE_COLLECTED}

  - id: not_available
    title: "No cab at that time"
    greeting: "Hello, City Cabs."
    default: "Ji haan, woh sab theek hai"
    replies:
      s3_ask: "Total 12000 rupaye lagega"
      s6_ask: "Is time pe gaadi available nahi hai"
    expect: {outcome: NOT_AVAILABLE}

  - id: other_time_offered
    title: "Offers another time: only noted, never accepted"
    greeting: "Hello, City Cabs."
    default: "Ji haan, woh sab theek hai"
    replies:
      s3_ask: "Total 12000 rupaye lagega"
      s6_ask: "6 baje to nahi, 8 baje ho jayegi"
    expect: {outcome: QUOTE_COLLECTED}

  - id: no_trip_facts
    title: "The trip facts are missing: the trip line is skipped"
    greeting: "Hello, City Cabs."
    default: "Ji haan, woh sab theek hai"
    brief: {from_place: "", to_place: "", pickup_time: "", people_count: ""}
    replies:
      s3_ask: "Total 12000 rupaye lagega"
    expect: {outcome: QUOTE_COLLECTED}

  - id: asks_trip_details
    title: "Asks where from / to: the trip line is said again (facts only)"
    greeting: "Hello, City Cabs."
    default: "Ji haan, woh sab theek hai"
    replies:
      s3_ask: ["Parking ka koi issue hai kya, kahan jana hai aapko?", "Total 12000 rupaye lagega"]
    expect: {outcome: QUOTE_COLLECTED}

  - id: busy_callback
    title: "Busy now: she asks when to call back"
    greeting: "Hello, City Cabs."
    replies:
      s3_ask: "Abhi busy hoon, baad mein call karna"
      busy_when: "Shaam 6 baje ke baad"
    expect: {outcome: CALL_BACK_LATER}

  - id: busy_at_identity
    title: "Busy at the identity question"
    greeting: "Hello?"
    replies:
      disclosure: "Abhi busy hoon, baad mein baat karte hain"
      busy_when: "Do baje call kar lijiye"
    expect: {outcome: CALL_BACK_LATER}

  - id: resume_price_known
    title: "Retry call: the price is known, resume hook, only the rest is asked"
    greeting: "Hello, City Cabs."
    default: "Ji haan, woh sab theek hai"
    brief: {resume: "yes", prior_price_inr: "12000"}
    replies:
      intro_resume: "Haan ji bataiye"
      s4_ask: "Swift Dzire"
      s5_ask: "Haan sab include hai"
      s6_ask: "Haan ho jayegi"
    expect: {outcome: QUOTE_COLLECTED}

  - id: whatsapp_same_number
    title: "WhatsApp pe bhej do, 'yahi number hai'"
    greeting: "Hello, City Cabs."
    replies:
      s3_ask: "WhatsApp pe bhej do details"
      wa_ask: "Yahi number hai"
    expect: {outcome: WHATSAPP_REQUESTED}

  - id: whatsapp_spoken_number
    title: "WhatsApp: gives digits, she reads them back, 'haan'"
    greeting: "Hello, City Cabs."
    replies:
      s3_ask: "Message kar do WhatsApp pe"
      wa_ask: "98111 22334"
      wa_readback: "Haan ji sahi hai"
    expect: {outcome: WHATSAPP_REQUESTED}

  - id: whatsapp_number_corrected
    title: "WhatsApp: the read-back is wrong, asks once more, the second is right"
    greeting: "Hello, City Cabs."
    replies:
      s3_ask: "WhatsApp pe bhej do"
      wa_ask: ["98111 22334", "98111 22335"]
      wa_readback: ["Nahi nahi galat hai", "Haan sahi hai"]
    expect: {outcome: WHATSAPP_REQUESTED}

  - id: whatsapp_not_available
    title: "No WhatsApp: the price is said on the call"
    greeting: "Hello, City Cabs."
    default: "Ji haan, woh sab theek hai"
    replies:
      s3_ask: ["WhatsApp pe bhej do", "Total 12000 rupaye lagega"]
      wa_ask: "Nahi nahi, hamare paas smartphone nahi hai"
    expect: {outcome: QUOTE_COLLECTED}

  - id: advance_raised_by_operator
    title: "The operator raises an advance: she asks how much, passes it on, never agrees"
    greeting: "Hello, City Cabs."
    default: "Ji haan, woh sab theek hai"
    replies:
      s3_ask: "Total 12000 rupaye lagega"
      s4_ask: "Pehle advance dena padega booking ke liye"
      adv_ask: "Paanch hazaar advance lagega"
    expect: {outcome: ADVANCE_ASKED}

  - id: booking_amount_asked_by_user_request
    title: "The user's request asks for the booking amount: she asks it once"
    greeting: "Hello, City Cabs."
    default: "Ji haan, woh sab theek hai"
    brief: {q_ask_advance: "yes"}
    replies:
      s3_ask: "Total 12000 rupaye lagega"
      s5_ask: "Haan sab include hai"
      adv_ask_user: "Koi booking amount nahi lagta"
    expect: {outcome: QUOTE_COLLECTED}

  - id: booking_amount_not_asked_by_default
    title: "Nobody mentions an advance: she never raises it"
    greeting: "Hello, City Cabs."
    default: "Ji haan, woh sab theek hai"
    replies:
      s3_ask: "Total 12000 rupaye lagega"
      s5_ask: "Haan sab include hai"
    expect: {outcome: QUOTE_COLLECTED}

  # ---- callbacks: negotiate
  - id: nego_push1_works
    title: "Push 1 at the target: agrees"
    greeting: "Hello, City Cabs."
    brief: {mode: negotiate, resume: "yes", prior_price_inr: "12000", target_price: "10000", max_price: "11000"}
    replies:
      push1: "Theek hai, 10000 mein ho jayega"
    expect: {outcome: PRICE_AGREED}

  - id: nego_push1_yes_only
    title: "Push 1: a plain 'haan'"
    greeting: "Hello, City Cabs."
    brief: {mode: negotiate, resume: "yes", prior_price_inr: "12000", target_price: "10000", max_price: "11000"}
    replies:
      push1: "Haan ji theek hai"
    expect: {outcome: PRICE_AGREED}

  - id: nego_push2_works
    title: "Push 1 refused, push 2 within the maximum"
    greeting: "Hello, City Cabs."
    brief: {mode: negotiate, resume: "yes", prior_price_inr: "12000", target_price: "10000", max_price: "11000"}
    replies:
      push1: "Nahi, 11000 se kam nahi hoga"
      push2: "Theek hai, 10500 kar dete hain"
    expect: {outcome: PRICE_AGREED}

  - id: nego_push2_above_max
    title: "Push 2: their price is above the maximum: never accepted, their price is recorded"
    greeting: "Hello, City Cabs."
    brief: {mode: negotiate, resume: "yes", prior_price_inr: "12000", target_price: "10000", max_price: "11000"}
    replies:
      push1: "Nahi, 11500 lagega"
      push2: "Nahi, 11500 se kam nahi hoga"
    expect: {outcome: NEGOTIATION_FAILED}

  - id: nego_both_refused
    title: "Both pushes refused"
    greeting: "Hello, City Cabs."
    brief: {mode: negotiate, resume: "yes", prior_price_inr: "12000", target_price: "10000", max_price: "11000"}
    replies:
      push1: "Nahi, 12000 hi lagega"
      push2: "Nahi, 12000 se kam nahi hoga"
    expect: {outcome: NEGOTIATION_FAILED}

  - id: nego_price_already_at_target
    title: "The recorded price is already within the target: no push"
    greeting: "Hello, City Cabs."
    brief: {mode: negotiate, resume: "yes", prior_price_inr: "9500", target_price: "10000", max_price: "11000"}
    expect: {outcome: PRICE_AGREED}

  # ---- callbacks: confirm
  - id: confirm_same_number
    title: "Confirm call: 'yahi number hai', then the booking line"
    greeting: "Hello, City Cabs."
    brief: {mode: confirm, resume: "yes", prior_price_inr: "11000", prior_slot: "kal subah 6 baje", date_window: "kal subah 6 baje", delegation_max_price: 12000}
    replies:
      cab_wa_ask: "Yahi number hai"
    expect: {outcome: BOOKED}

  - id: confirm_number_corrected
    title: "Confirm call: the read-back is wrong once"
    greeting: "Hello, City Cabs."
    brief: {mode: confirm, resume: "yes", prior_price_inr: "11000", prior_slot: "kal subah 6 baje", date_window: "kal subah 6 baje", delegation_max_price: 12000}
    replies:
      cab_wa_ask: ["98111 22334", "98111 22335"]
      wa_readback: ["Nahi nahi galat hai", "Haan sahi hai"]
    expect: {outcome: BOOKED}

  - id: confirm_user_approval_covers_price
    title: "Confirm call: the user's approval covers the price (even above the old delegation): books"
    greeting: "Hello, City Cabs."
    brief: {mode: confirm, resume: "yes", prior_price_inr: "11000", prior_slot: "kal subah 6 baje", date_window: "kal subah 6 baje", delegation_max_price: 9000}
    replies:
      cab_wa_ask: "Yahi number hai"
    expect: {outcome: BOOKED}

  # ---- the usual vendor behaviours
  - id: puts_on_hold
    title: "Puts Friday on hold, then continues"
    greeting: "Hello, City Cabs."
    default: "Ji haan, woh sab theek hai"
    replies:
      s3_ask: [{say: "Ek minute hold kijiye", hold_s: 20, then: "Haan boliye, kya poochh rahi thi?"}, "Total 12000 rupaye"]
    expect: {outcome: QUOTE_COLLECTED}

  - id: hold_too_long
    title: "Hold and never comes back"
    greeting: "Hello, City Cabs."
    replies:
      s3_ask: {say: "Ek minute ruko", hold_s: 300, then: "Haan boliye"}
    expect: {call_outcome: hold_timeout}

  - id: wrong_number_at_identity
    title: "Wrong number (said at the identity question)"
    greeting: "Hello?"
    replies:
      disclosure: "Nahi, yeh toh dukaan hai, wrong number"
    expect: {outcome: WRONG_NUMBER}

  - id: wrong_number_later
    title: "Wrong number (said after the hook)"
    greeting: "Hello, City Cabs."
    replies:
      s3_ask: "Yeh cab service nahi hai, galat number lagaya hai aapne"
    expect: {outcome: WRONG_NUMBER}

  - id: rude_hangs_up
    title: "Rude, then hangs up"
    greeting: "Hello, City Cabs."
    replies:
      s3_ask: {say: "Faltu mein tang mat karo, bakwas band karo", hangup: true}
    expect: {outcome: REFUSED}

  - id: dnc_request
    title: "Asks not to be called again"
    stop_request: true
    greeting: "Hello, City Cabs."
    replies:
      s3_ask: "Dobara call mat karna, number hata do"
    expect: {outcome: REFUSED}

  - id: ai_robot_at_identity
    title: "Asks 'robot hai kya?' at the identity question"
    greeting: "Hello?"
    default: "Ji haan, woh sab theek hai"
    replies:
      disclosure: "Yeh robot hai kya?"
      s3_ask: "Total 12000 rupaye"
    expect: {outcome: QUOTE_COLLECTED}

  - id: ai_asked_midway
    title: "Asks 'insaan ho ya machine?' at the price question"
    greeting: "Hello, City Cabs."
    default: "Ji haan, woh sab theek hai"
    replies:
      s3_ask: ["Aap insaan ho ya machine?", "Total 12000 rupaye"]
    expect: {outcome: QUOTE_COLLECTED}

  - id: ai_asked_in_english
    title: "Are you an AI? (English)"
    greeting: "Hello, City Cabs."
    default: "Ji haan, woh sab theek hai"
    replies:
      s3_ask: ["Is this an AI?", "12000 rupees"]
    expect: {outcome: QUOTE_COLLECTED}

  - id: asks_who_first
    title: "Asks who is calling before the identity question"
    greeting: "Hello?"
    default: "Ji haan, woh sab theek hai"
    replies:
      disclosure: "Kaun bol raha hai?"
      s0_who: "Haan ji, yahi City Cabs hai, boliye"
      s3_ask: "Total 12000 rupaye"
    expect: {outcome: QUOTE_COLLECTED}

  - id: asks_customer_phone
    title: "Asks for the user's number; she does not share it"
    greeting: "Hello, City Cabs."
    default: "Ji haan, woh sab theek hai"
    replies:
      s3_ask: ["Unka number kya hai?", "Total 12000 rupaye"]
    expect: {outcome: QUOTE_COLLECTED}

  - id: asks_otp
    title: "Asks for an OTP; she never shares secrets"
    greeting: "Hello, City Cabs."
    default: "Ji haan, woh sab theek hai"
    replies:
      s3_ask: ["Pehle OTP bata dijiye", "Total 12000 rupaye"]
    expect: {outcome: QUOTE_COLLECTED}

  - id: noisy_then_clear
    title: "Noisy line, clear after the re-ask"
    greeting: "Hello?"
    default: "Ji haan, woh sab theek hai"
    replies:
      s3_ask: ["kkh... hmm...", "Total 12000 rupaye"]
    expect: {outcome: QUOTE_COLLECTED}

  - id: absurd_price_asked_again
    title: "A price outside the sane range is not trusted: she asks again"
    greeting: "Hello, City Cabs."
    default: "Ji haan, woh sab theek hai"
    brief: {price_min: 2000}
    replies:
      s3_ask: ["Total 50 rupaye", "Nahi nahi, 12000 rupaye"]
    expect: {outcome: QUOTE_COLLECTED}

  - id: silent_after_identity
    title: "Says nothing after the identity question"
    greeting: "Hello?"
    default: {silence: true}
    replies:
      disclosure: {silence: true}
      s0_who: {silence: true}
    expect: {call_outcome: hung_up}

  - id: confirm_no_slot_known
    title: "Confirm call but the pickup time was not carried in: no booking line, the user is asked again"
    greeting: "Hello, City Cabs."
    brief: {mode: confirm, resume: "yes", prior_price_inr: "11000", delegation_max_price: 12000}
    replies:
      cab_wa_ask: "Yahi number hai"
    expect: {outcome: CONFIRM_PENDING}

  - id: resume_after_inclusions
    title: "Retry call cut after the inclusions: car and inclusions are not asked again"
    greeting: "Hello, City Cabs."
    default: "Ji haan, woh sab theek hai"
    brief: {resume: "yes", prior_price_inr: "12000", prior_steps: "S0>S1>S3>S4>S5>S6"}
    replies:
      intro_resume: "Haan ji bataiye"
      s6_ask: "Haan ho jayegi"
    expect: {outcome: QUOTE_COLLECTED}
