# PENDING (founder script review 13 Oct 2026, SCRIPTS_SPEC 7b + global rules). NOT loaded by
# production: it waits in friday/playbooks/pending/ until the founder has HEARD the audio and approved
# it (hear-before-change). Promote only with: friday playbook promote hotel_booking
#
# hotel_booking (archetype hotel_booking): Friday asks a hotel for rooms on the user's dates.
# Modes of ONE playbook (input `playbook_mode`):
#   quote_only  (default, first call) hook -> dates/guests/rooms -> options + price -> tax,
#               breakfast, check-in/out, cancellation -> (booking amount only if the USER asked,
#               `q_ask_advance`) -> close "main ek baar <user> ko bata deti hoon ..."
#   negotiate   callback, ONLY when the user asked: push 1 at target_price, push 2 at push2_price,
#               never above max_price; then the call-back line (no price is ever agreed here)
#   confirm     callback after the user approved: "<user> ne confirm kar diya hai, toh aap <dates>
#               ka room <full name> ke naam se book kar lijiye." (no WhatsApp step). Needs the
#               earlier price + a non-empty `prior_slot` (e.g. the check-in date) and the brief's
#               approved_terms: the line is a commit line behind can_commit like the salon's.
# Retry (resume: yes + prior_*): the hook is the resume hook; answered steps are skipped.
# The business raising an advance / booking amount: "{ack}, ek baar advance ya booking amount
# kitna hoga?" then "main ek baar <user> ko bata deti hoon, wo aapko advance payment initiate kar
# denge. Thank you." Friday never pays and never asks on her own. A phone number the business gives
# (payment number, or the WhatsApp number) is read back in groups of five digits.
# Names are inputs; the voice reads the *_spoken forms. The model never writes Friday's words.

version: 1
id: hotel_booking
archetype: hotel_booking
title: Hotel booking (room enquiry, tax, breakfast, check-in/out, cancellation)
language: hinglish

inputs:
  user_first_name: {required: true}
  user_spoken: {}
  honorific: {default: sir}
  business_name: {required: true}
  business_name_spoken: {}
  service: {default: room booking}
  services: {}
  services_spoken: {}
  playbook_mode: {default: quote_only}    # quote_only | negotiate | confirm
  category: {}
  price_min: {}              # category sanity range: a price outside it is not trusted
  price_max: {}
  budget: {}
  user_full_name: {}
  user_full_spoken: {}
  # facts about the user's request (said from the facts only, never invented)
  checkin_date: {}
  checkout_date: {}
  guests: {}
  room_count: {}
  room_type: {}
  target_price: {}           # negotiation push 1 (never above the user's maximum)
  max_price: {}
  q_ask_advance: {default: "no"}   # the USER's request asks for a booking amount
  # retry / callback: what the earlier call already learned (never asked again)
  resume: {}
  prior_price_inr: {}
  prior_slot: {}
  prior_notes: {}
  prior_flags: {}

outputs: [price_inr, price_low_inr, price_unit, advance_needed, whatsapp_requested, captured_number, outcome]

limits:
  max_duration_s: 240
  max_repeats: 4
  max_unclear_per_step: 2
  hold_max_s: 60
  max_turns: 40

disclosure: disclosure
ai_disclosure: on_request
reintro: reintro

confusion:
  line: sorry
  outcome: UNCLEAR
  close: bye_unclear

lines:
  disclosure: "Hello, kya meri baat {business_name_spoken} se ho rahi hai?"
  reintro: "Ji, main Friday hoon, {user_spoken} {honorific} ki virtual assistant."
  s0_who: "Ji, main Friday hoon, {user_spoken} {honorific} ki virtual assistant. Kya meri baat {business_name_spoken} se ho rahi hai?"
  recording_notice: "Yeh call quality ke liye record ho sakta hai."
  # the HOOK: one short line, then WAIT for "haan ji, bataiye"
  intro: "Ji sir, actually maine aapko room booking ke regarding call kiya tha."
  intro_resume: "Ji sir, actually maine pehle room booking ke regarding call kiya tha, bas ek-do cheezein reh gayi thi."
  # she states the request (from the user's facts)
  request: "Ji, hamko {checkin_date} se {checkout_date} tak, {guests} log ke liye, {room_count} room chahiye."
  s3_ask: "{ack}, toh ek baar options bata dijiye, unka estimated price kya hoga?"
  # NO room: alternate days
  bye_noroom: "Theek hai sir, thank you. Main {user_spoken} {honorific} se alternate days ke liye confirm karke aapko call back karti hoon."
  tax_ask: "Toh sir, yeh price tax ke saath hai ya tax alag se lagega?"
  bf_ask: "Aur isme breakfast include rahega?"
  time_ask: "Aur check-in aur check-out ka time kya rehta hai?"
  canc_ask: "Aur cancellation ki kya policy hai?"
  # booking amount: only if the USER asked (adv_user) or the BUSINESS raised it (adv_raised)
  adv_user: "Achha theek hai sir, ek baar booking amount kitna lenge?"
  adv_raised: "{ack}, ek baar advance ya booking amount kitna hoga?"
  adv_close: "Theek hai sir, main ek baar {user_spoken} {honorific} ko bata deti hoon, wo aapko advance payment initiate kar denge. Thank you."
  # phone number capture (WhatsApp number, or a payment number the business reads out)
  wa_ask: "Theek hai sir, ek baar aap please WhatsApp ka number confirm kar sakte hain?"
  wa_readback: "{captured_spoken}, yahi number hai na?"
  wa_ok: "Okay sir, main aapko WhatsApp kar deti hoon."
  # GLUE (not in the founder's spec; needs his OK): no WhatsApp -> say it here
  wa_decline: "Achha sir, abhi WhatsApp possible nahi hai, aap yahin bata dijiye please."
  # negotiation (callback, only when the user asked)
  push1: "Toh sir, {user_spoken} {honorific} se baat ho gayi hai, price thoda humare budget se upar hai. Humara budget {target_price} ka hai, toh isme bataiye kuch ho sakta hai kya?"
  push2: "Achha sir, thoda aur dekh lijiye na, kya {push2_price} tak ho payega?"
  neg_close: "Theek hai sir, main ek baar {user_spoken} {honorific} se final confirmation leke aapko call back karti hoon."
  # GLUE: they said yes/ok to the push but gave no number
  neg_final_ask: "{ack}, toh final price kitna rahega?"
  # confirmation callback (a commit line: gated in code)
  confirm_commit:
    text: "{user_spoken} {honorific} ne confirm kar diya hai, toh aap {checkin_date} se {checkout_date} tak ka room {user_full_spoken} ke naam se book kar lijiye."
    commit: true
  confirm_wait: "{ack}, main {user_spoken} {honorific} se confirm karke aapko thodi der mein call back karti hoon. Thank you."
  q_close: "{ack}, main ek baar {user_spoken} {honorific} ko bata deti hoon, aur thodi der mein aapko confirm karke batati hoon."
  ai_yes: "Ji, haan, main {user_spoken} {honorific} ki personal AI assistant hoon."
  bye_busy: "Ji koi baat nahi sir, main kab call kar sakti hoon?"
  bye_busy_ok: "Ji theek hai, main tab call karti hoon. Thank you."
  bye_wrong: "Ji maaf kijiye, galat number lag gaya. Thank you."
  bye_dnc: "Ji theek hai, hum dobara call nahi karenge. Thank you."
  bye_rude: "Ji maaf kijiye, pareshan karne ke liye. Thank you."
  bye_unclear: "Ji maaf kijiye, awaaz saaf nahi aa rahi. Main baad mein call karti hoon. Thank you."
  no_number: "Ji, {user_spoken} {honorific} ka number main share nahi kar sakti."
  sorry: "Sorry, ek baar phir?"
  offscript: "Achha, yeh main {user_spoken} {honorific} se poochh kar bataungi."
  no_secrets: "Ji, yeh jaankari main share nahi kar sakti."

routes:
  after_hook:
    - {when: [mode_confirm], goto: C}
    - {when: [mode_negotiate, has_target_price], goto: N1}
    - {when: [mode_negotiate], goto: NC}
    - {goto: S2}
  after_price:
    - {goto: S4}
  after_details:
    - {when: [q_ask_advance], goto: AQ}
    - {goto: S7q}

defaults:
  STOP_CALLING: {say: [bye_dnc], outcome: REFUSED, set: {do_not_call: "yes"}}
  RUDE: {say: [bye_rude], outcome: REFUSED, set: {rude: "yes"}}
  WRONG_NUMBER: {say: [bye_wrong], outcome: WRONG_NUMBER, set: {wrong_number: "yes"}}
  BUSY_LATER: {goto: BL}
  NO_ADVANCE: {set: {advance_needed: "no"}, repeat: true, max_uses: 2}
  ARE_YOU_BOT: {say: [ai_yes], repeat: true}
  WHO_IS_THIS:
    - {say: [reintro, intro], repeat: true, max_uses: 1}
    - {say: [intro], repeat: true, max_uses: 1}
  ASKS_REPEAT: {repeat: true, max_uses: 3}
  HOLD_ON: {hold_s: 60, max_uses: 3}
  ASKS_OFFTOPIC: {say: [offscript], repeat: true, max_uses: 3}
  ASKS_SECRET: {say: [no_secrets], repeat: true, max_uses: 2}
  ASKS_CUSTOMER_PHONE: {say: [no_number], repeat: true, max_uses: 2}
  # the BUSINESS raises an advance / booking amount: ask how much, then pass it on (never agree)
  NEEDS_ADVANCE: {set: {advance_needed: "yes"}, goto: AR}
  # "WhatsApp pe bhej do": ask for the WhatsApp number (read back), see W1
  WHATSAPP_PLEASE: {set: {whatsapp_requested: "yes"}, goto: W1}

start: S0
commit_step: C

steps:
  S0:   # identity check; the runner already asked the identity question; Friday WAITS
    branches:
      YES: {goto: S1}
      CONTINUE: {goto: S1}
      ACK: {goto: S1}
      NO: {say: [bye_wrong], outcome: WRONG_NUMBER, set: {wrong_number: "yes"}}
      WHO_IS_THIS: {say: [s0_who], stay: true, max_uses: 2}
      ASKS_REPEAT: {say: [s0_who], stay: true, max_uses: 2}
      ARE_YOU_BOT: {say: [ai_yes], goto: S1}
      ASKS_OFFTOPIC: {say: [s0_who], stay: true}
      ASKS_SECRET: {say: [s0_who], stay: true}
      ASKS_CUSTOMER_PHONE: {say: [s0_who], stay: true}
      WHATSAPP_PLEASE: {say: [s0_who], stay: true, max_uses: 1}

  S1:   # the HOOK (the resume hook on a retry), then wait for "haan ji, bataiye"
    ask:
      - {line: recording_notice, when: [recording, first_ask]}
      - {line: intro, when: ["!is_resume"]}
      - {line: intro_resume, when: [is_resume]}
    branches:
      YES: {goto: "@after_hook"}
      CONTINUE: {goto: "@after_hook"}
      ACK: {goto: "@after_hook"}
      ASKS_REPEAT: {repeat: true, max_uses: 1}
      ANY: {goto: "@after_hook"}

  S2:   # she states the request; the hotel says rooms / options / price, or no room
    skip_when: [price_known]
    ask: [request]
    branches:
      SLOT_FREE: {goto: S3}
      YES: {goto: S3}
      OFFERS_SLOTS: {goto: S3}
      GIVES_TIME: {goto: S3}
      GIVES_PRICE:
        - {when: [price_known], goto: "@after_price"}
        - {goto: S3}
      PRICE_RANGE:
        - {when: [price_known], goto: "@after_price"}
        - {goto: S3}
      SLOT_BUSY: {goto: S9}
      NO: {goto: S9}
      CONTINUE: {repeat: true, max_uses: 1}
      ASKS_OFFTOPIC: {repeat: true, max_uses: 1}    # "kitne log, kab se?": the request again (the facts)
      ASKS_REPEAT: {repeat: true, max_uses: 2}
      ANY: {goto: S3}

  S3:   # options and their estimated price
    skip_when: [price_known]
    ask: [s3_ask]
    branches:
      GIVES_PRICE:
        - {when: [price_known], goto: "@after_price"}
        - {repeat: true}
      PRICE_RANGE:
        - {when: [price_known], goto: "@after_price"}
        - {repeat: true}
      PRICE_DEPENDS: {set: {price_note: depends}, goto: "@after_price"}
      REFUSES_PRICE: {set: {price_unknown: "yes"}, goto: "@after_price"}
      VISIT_NEEDED: {set: {price_unknown: "yes"}, goto: "@after_price"}
      SLOT_BUSY: {goto: S9}
      NO: {goto: S9}
      CONTINUE: {repeat: true, max_uses: 2}
      YES: {repeat: true, max_uses: 2}
      ASKS_REPEAT: {repeat: true, max_uses: 2}
      ANY: {goto: S9}

  S4:
    ask: [tax_ask]
    branches:
      CONTINUE: {repeat: true, max_uses: 1}
      ANY: {goto: S5}

  S5:
    ask: [bf_ask]
    branches:
      CONTINUE: {repeat: true, max_uses: 1}
      ANY: {goto: S6}

  S6:
    ask: [time_ask]
    branches:
      CONTINUE: {repeat: true, max_uses: 1}
      ANY: {goto: S8}

  S8:
    ask: [canc_ask]
    branches:
      CONTINUE: {repeat: true, max_uses: 1}
      NEEDS_ADVANCE: {goto: "@after_details"}   # a cancellation charge is the answer, not an advance
      ANY: {goto: "@after_details"}

  AQ:   # ONLY when the user's own request asks for a booking amount
    ask: [adv_user]
    branches: &adv_answer
      NO_ADVANCE: {set: {advance_needed: "no"}, goto: S7q}
      GIVES_NUMBER: {goto: AN2}
      SAME_NUMBER: {goto: AC}
      WHATSAPP_PLEASE: {goto: AW1}
      CONTINUE: {repeat: true, max_uses: 1}
      NEEDS_ADVANCE: {set: {advance_needed: "yes"}, goto: AC}
      ANY: {set: {advance_needed: "yes"}, goto: AC}

  AR:   # the business raised it; adv_raised was just said by the default
    note: booking_amount
    ask: [adv_raised]
    branches: *adv_answer

  AN2:  # a payment number was read out: read it back
    ask: [wa_readback]
    branches:
      YES: {goto: AC}
      SAME_NUMBER: {goto: AC}
      NO: {goto: AW1}
      ANY: {goto: AC}

  AW1:  # QR / bank details by WhatsApp: ask the WhatsApp number
    max_visits: 2
    ask: [wa_ask]
    branches:
      GIVES_NUMBER: {goto: AW2}
      SAME_NUMBER: {goto: AWD}
      NO: {say: [wa_decline], stay: true, max_uses: 1}
      WHATSAPP_PLEASE: {repeat: true, max_uses: 1}
      YES: {repeat: true, max_uses: 1}
      CONTINUE: {repeat: true, max_uses: 1}
      ANY: {goto: AC}

  AW2:
    ask: [wa_readback]
    branches:
      YES: {goto: AWD}
      SAME_NUMBER: {goto: AWD}
      NO: {goto: AW1}
      ANY: {goto: AWD}

  AWD:
    final: true
    branches:
      ANY:
        - {say: [wa_ok, adv_close], set: {whatsapp_requested: "yes", advance_needed: "yes"}, outcome: ADVANCE_ASKED}

  AC:
    final: true
    branches:
      ANY:
        - {say: [adv_close], set: {advance_needed: "yes"}, outcome: ADVANCE_ASKED}

  W1:   # "WhatsApp pe bhej do": which number?
    max_visits: 2
    ask: [wa_ask]
    branches:
      GIVES_NUMBER: {goto: W2}
      SAME_NUMBER: {goto: WD}
      NO: {say: [wa_decline], goto: S3}
      WHATSAPP_PLEASE: {repeat: true, max_uses: 1}
      YES: {repeat: true, max_uses: 1}
      CONTINUE: {repeat: true, max_uses: 1}
      ANY: {say: [q_close], outcome: WHATSAPP_REQUESTED}

  W2:   # read the number back in groups
    ask: [wa_readback]
    branches:
      YES: {goto: WD}
      SAME_NUMBER: {goto: WD}
      NO: {goto: W1}
      ANY: {goto: WD}

  WD:
    final: true
    branches:
      ANY:
        - {say: [wa_ok], outcome: WHATSAPP_REQUESTED}

  BL:   # "busy hoon": she asked when to call; their time is noted (their words only)
    note: callback_time
    ask: [bye_busy]
    branches:
      ANY:
        - {say: [bye_busy_ok], outcome: CALL_BACK_LATER}

  S9:   # no room on those dates
    final: true
    branches:
      ANY:
        - {say: [bye_noroom], set: {not_available: "yes"}, outcome: NO_ROOM}

  S7q:  # the close of the first call
    final: true
    branches:
      ANY:
        - {when: [price_known], say: [q_close], outcome: QUOTE_COLLECTED}
        - {say: [q_close], outcome: PRICE_ON_REQUEST}

  # ---- negotiation callback (only when the user asked): push 1, push 2, never above max_price
  N1:
    ask: [push1]
    branches:
      GIVES_PRICE:
        - {when: [price_le_target], goto: NC}
        - {goto: N2}
      PRICE_RANGE:
        - {when: [price_le_target], goto: NC}
        - {goto: N2}
      YES: {goto: NY}
      ACK: {goto: NY}
      CONTINUE: {goto: NY}
      NO: {goto: N2}
      ANY: {goto: N2}

  NY:   # "haan dekhte hain" without a number
    max_visits: 1
    ask: [neg_final_ask]
    branches:
      GIVES_PRICE:
        - {when: [price_le_target], goto: NC}
        - {goto: N2}
      PRICE_RANGE:
        - {when: [price_le_target], goto: NC}
        - {goto: N2}
      ANY: {goto: N2}

  N2:
    max_visits: 1
    ask: [push2]
    branches:
      GIVES_PRICE: {goto: NC}
      PRICE_RANGE: {goto: NC}
      ANY: {goto: NC}

  NC:   # their last price is recorded; the confirmation comes after the user decides
    final: true
    branches:
      ANY:
        - {when: [price_known], say: [neg_close], outcome: NEGOTIATED}
        - {say: [neg_close], outcome: PRICE_ON_REQUEST}

  # ---- confirmation callback: the user approved
  C:
    final: true
    branches:
      ANY:
        - {when: [can_commit, "!alt_offered"], say: [confirm_commit], commit: true, outcome: BOOKED}
        - {say: [confirm_wait], outcome: QUOTE_COLLECTED}

outcomes:
  QUOTE_COLLECTED:
    call_outcome: partial
    description: price (price_inr) collected, nothing booked; the user decides
    needs_quote: true
  NEGOTIATED:
    call_outcome: partial
    description: negotiation callback done; their last price is recorded, confirmation comes after the user decides
    needs_quote: true
  BOOKED:
    call_outcome: success
    description: confirmation callback - the hotel was told to book under the user's name (the user approved)
    needs_quote: true
  NO_ROOM:
    call_outcome: partial
    description: no room on the asked dates; alternate days to be checked with the user
    collected: {not_available: "yes"}
  ADVANCE_ASKED:
    call_outcome: partial
    description: a booking amount / advance was discussed; passed to the user, Friday did not agree or pay
  WHATSAPP_REQUESTED:
    call_outcome: partial
    description: details to go by WhatsApp (captured_number holds the number, or "same")
    collected: {whatsapp_requested: "yes"}
  PRICE_ON_REQUEST:
    call_outcome: partial
    description: no price on the phone / it depends
  CALL_BACK_LATER:
    call_outcome: callback_later
    description: they asked us to call later
  WRONG_NUMBER:
    call_outcome: declined
    description: wrong number / not a hotel
    collected: {wrong_number: "yes"}
  REFUSED:
    call_outcome: declined
    description: asked not to be called again, or hostile (no retry)
  UNCLEAR:
    call_outcome: partial
    description: could not understand them
  NO_ANSWER:
    call_outcome: no_answer
    description: nobody picked up (set by the call runner)
