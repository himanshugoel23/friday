# Simulated home-service vendors for `friday playbook dry-run home_service_visit --pending`.
# Format: see friday/playbooks/data/salon_booking.personas.yaml. Replies are keyed by the line id
# Friday last spoke: s3_ask (visit charge), s4_ask (rough estimate), s5_ask (can you come),
# s5b_ask (when then), s6_ask (arrival window). `preview_*` feed `friday playbook preview`.

version: 1
playbook: home_service_visit

brief:
  user_first_name: Rahul
  honorific: sir
  services: "AC repair"
  business_name: "Cool Air Services"
  category: ac_repair
  date_window: "kal subah"
  price_min: 50
  price_max: 3000
  estimate_max: 30000
  q_estimate: "yes"
  q_today: "yes"
  q_arrival: "yes"

personas:
  - id: preview_visit
    title: "Founder audio: visit charge, rough estimate, can come, arrival window"
    greeting: "Hello, Cool Air Services."
    replies:
      s3_ask: "Visit charge 300 rupaye hai"
      s4_ask: "Kaam 800 se 1500 rupaye tak aa jata hai"
      s5_ask: "Haan kal subah aa sakte hain"
      s6_ask: "Subah 10 se 12 baje ke beech"
    expect: {outcome: QUOTE_COLLECTED}

  - id: preview_visit_on_site
    title: "Founder audio: they can only estimate after seeing it"
    greeting: "Hello, Cool Air Services."
    replies:
      s3_ask: "Visit charge 300 rupaye hai"
      s4_ask: "Dekhne ke baad hi bata sakte hain"
      s5_ask: "Haan kal subah aa sakte hain"
      s6_ask: "Subah 11 baje tak"
    expect: {outcome: QUOTE_COLLECTED}

  - id: visit_free
    title: "The visit is free (no charge)"
    greeting: "Hello, Cool Air Services."
    replies:
      s3_ask: "Visit free hai ji, kaam ke paise lagte hain"
      s4_ask: "Lagbhag 1000 rupaye"
      s5_ask: "Haan aa sakte hain"
      s6_ask: "Dopahar mein"
    expect: {outcome: QUOTE_COLLECTED}

  - id: visit_charge_adjusted
    title: "Visit charge adjusted in the work"
    greeting: "Hello, Cool Air Services."
    replies:
      s3_ask: "300 rupaye visit ka, kaam mein adjust ho jata hai"
      s4_ask: "Lagbhag 1200 rupaye"
      s5_ask: "Haan kal ho jayega"
      s6_ask: "Subah 10 baje"
    expect: {outcome: QUOTE_COLLECTED}

  - id: estimate_in_words
    title: "Estimate said in words (do se dhai hazaar)"
    greeting: "Hello, Cool Air Services."
    replies:
      s3_ask: "Teen sau rupaye lagte hain visit ke"
      s4_ask: "Do hazaar se dhai hazaar rupaye tak"
      s5_ask: "Haan kal subah aa sakte hain"
      s6_ask: "Subah 9 baje"
    expect: {outcome: QUOTE_COLLECTED}

  - id: per_hour_unit
    title: "Carpenter: hourly rate (per-unit price)"
    greeting: "Hello, Wood Works."
    brief: {services: "furniture repair", business_name: "Wood Works", category: carpenter}
    replies:
      s3_ask: "Visit ka kuch nahi, hourly 400 rupaye lagte hain"
      s4_ask: "Dekh ke hi bata sakte hain"
      s5_ask: "Haan kal aa sakte hain"
      s6_ask: "Subah 10 baje"
    expect: {outcome: QUOTE_COLLECTED}

  - id: per_sqft_estimate
    title: "Painter: rate per square foot as the estimate"
    greeting: "Hello, Rang Painters."
    brief: {services: "painting 2 BHK", business_name: "Rang Painters", category: painter, price_min: 0, estimate_max: 200000}
    replies:
      s3_ask: "Visit free hai, survey ke baad quote denge"
      s4_ask: "12 rupaye per square feet lagta hai"
      s5_ask: "Haan kal aa sakte hain"
      s6_ask: "Subah 11 baje"
    expect: {outcome: QUOTE_COLLECTED}

  - id: today_not_possible
    title: "Not tomorrow morning: she asks when then"
    greeting: "Hello, Cool Air Services."
    replies:
      s3_ask: "Visit charge 300 rupaye"
      s4_ask: "Lagbhag 1000 rupaye"
      s5_ask: "Kal subah nahi ho payega"
      s5b_ask: "Parso subah tak aa sakte hain"
    expect: {outcome: QUOTE_COLLECTED}

  - id: whatsapp_photo_then_price
    title: "'WhatsApp pe photo bhej do', then says the charge"
    greeting: "Hello, Cool Air Services."
    replies:
      s3_ask: ["WhatsApp pe problem ki photo bhej do", "Theek hai, visit 300 rupaye hai"]
      s4_ask: "Lagbhag 1000 rupaye"
      s5_ask: "Haan kal subah aa sakte hain"
      s6_ask: "Subah 10 baje"
    expect: {outcome: QUOTE_COLLECTED}

  - id: whatsapp_insists
    title: "Insists on WhatsApp: polite close, flagged"
    greeting: "Hello, Cool Air Services."
    replies:
      s3_ask: ["WhatsApp pe photo bhej do", "Nahi, WhatsApp pe hi bhej do"]
    expect: {outcome: WHATSAPP_REQUESTED}

  - id: visit_needed_for_everything
    title: "'Dekh ke hi bata sakte hain' for everything"
    greeting: "Hello, Cool Air Services."
    replies:
      s3_ask: "Dekh ke hi bata sakte hain"
      s4_ask: "Dekhne ke baad hi estimate denge"
      s5_ask: "Haan aa sakte hain"
      s6_ask: "Subah"
    expect: {outcome: NEEDS_VISIT}

  - id: busy_callback
    title: "On a job, call later"
    greeting: "Hello, Cool Air Services."
    replies:
      s3_ask: "Abhi busy hain, baad mein call karna"
    expect: {outcome: CALL_BACK_LATER}

  - id: puts_on_hold
    title: "Goes to check the diary: hold, then answers"
    greeting: "Hello, Cool Air Services."
    replies:
      s3_ask: [{say: "Ek minute hold kijiye", hold_s: 25, then: "Haan boliye, kya poochh rahi thi?"}, "Visit 300 rupaye hai"]
      s4_ask: "Lagbhag 1000 rupaye"
      s5_ask: "Haan aa sakte hain"
      s6_ask: "Subah 10 baje"
    expect: {outcome: QUOTE_COLLECTED}

  - id: hold_too_long
    title: "Hold and never comes back"
    greeting: "Hello, Cool Air Services."
    replies:
      s3_ask: {say: "Ek minute ruko", hold_s: 300, then: "Haan boliye"}
    expect: {call_outcome: hold_timeout}

  - id: wrong_number
    title: "Wrong number at the identity question"
    greeting: "Hello?"
    replies:
      disclosure: "Nahi, yeh toh dukaan hai, wrong number"
    expect: {outcome: WRONG_NUMBER}

  - id: wrong_number_later
    title: "Wrong number (said after the intro)"
    greeting: "Hello, Cool Air Services."
    replies:
      s3_ask: "Hum AC repair nahi karte, yeh galat number hai"
    expect: {outcome: WRONG_NUMBER}

  - id: rude_hangs_up
    title: "Rude, then hangs up"
    greeting: "Hello, Cool Air Services."
    replies:
      s3_ask: {say: "Faltu mein tang mat karo, bakwas band karo", hangup: true}
    expect: {outcome: REFUSED}

  - id: dnc_request
    title: "Asks not to be called again"
    stop_request: true
    greeting: "Hello, Cool Air Services."
    replies:
      s3_ask: "Dobara call mat karna, number hata do"
    expect: {outcome: REFUSED}

  - id: ai_robot_at_identity
    title: "Asks 'robot hai kya?' at the identity question"
    greeting: "Hello?"
    replies:
      disclosure: "Yeh robot hai kya?"
      s3_ask: "Visit 300 rupaye hai"
      s4_ask: "Lagbhag 1000 rupaye"
      s5_ask: "Haan aa sakte hain"
      s6_ask: "Subah 10 baje"
    expect: {outcome: QUOTE_COLLECTED}

  - id: ai_asked_at_estimate
    title: "Asks 'AI ho?' at the estimate question"
    greeting: "Hello, Cool Air Services."
    replies:
      s3_ask: "Visit 300 rupaye hai"
      s4_ask: ["Aap AI ho kya?", "Lagbhag 1000 rupaye"]
      s5_ask: "Haan aa sakte hain"
      s6_ask: "Subah 10 baje"
    expect: {outcome: QUOTE_COLLECTED}

  - id: refuses_everything
    title: "No price on the phone at all"
    greeting: "Hello, Cool Air Services."
    replies:
      s3_ask: "Phone par rate nahi batate"
      s4_ask: "Phone par kuch nahi bata sakte"
      s5_ask: "Haan aa sakte hain"
      s6_ask: "Subah"
    expect: {outcome: NEEDS_VISIT}

  - id: advance_with_charge
    title: "Advance with the visit charge: she does not agree, the charge is kept"
    greeting: "Hello, Cool Air Services."
    replies:
      s3_ask: "Visit 300 rupaye, 100 rupaye advance dena padega"
      s4_ask: "Lagbhag 1000 rupaye"
      s5_ask: "Haan aa sakte hain"
      s6_ask: "Subah 10 baje"
    expect: {outcome: QUOTE_COLLECTED}

  - id: absurd_estimate_asked_again
    title: "An estimate above the sane ceiling is not trusted: she asks again"
    greeting: "Hello, Cool Air Services."
    brief: {estimate_max: 5000}
    replies:
      s3_ask: "Visit 300 rupaye"
      s4_ask: ["Estimate 25000 rupaye", "Nahi nahi, 2500 rupaye"]
      s5_ask: "Haan aa sakte hain"
      s6_ask: "Subah 10 baje"
    expect: {outcome: QUOTE_COLLECTED}

  - id: no_estimate_question
    title: "Category does not ask the estimate"
    greeting: "Hello, Cool Air Services."
    brief: {q_estimate: "no"}
    replies:
      s3_ask: "Visit 300 rupaye"
      s5_ask: "Haan aa sakte hain"
      s6_ask: "Subah 10 baje"
    expect: {outcome: QUOTE_COLLECTED}

  - id: no_day_question
    title: "Category does not ask today / tomorrow"
    greeting: "Hello, Cool Air Services."
    brief: {q_today: "no", q_arrival: "no"}
    replies:
      s3_ask: "Visit 300 rupaye"
      s4_ask: "Lagbhag 1000 rupaye"
    expect: {outcome: QUOTE_COLLECTED}

  - id: no_date_in_the_task
    title: "The task names no day: 'aaj ya kal'"
    greeting: "Hello, Cool Air Services."
    brief: {date_window: ""}
    replies:
      s3_ask: "Visit 300 rupaye"
      s4_ask: "Lagbhag 1000 rupaye"
      s5_ask: "Haan aaj shaam aa sakte hain"
      s6_ask: "Shaam 5 baje"
    expect: {outcome: QUOTE_COLLECTED}

  - id: packers_free_survey
    title: "Packers: free survey, the quote comes after it"
    greeting: "Hello, Safe Movers."
    brief: {services: "2 BHK shifting", business_name: "Safe Movers", category: packers_movers}
    replies:
      s3_ask: "Survey free hai ji"
      s4_ask: "Survey ke baad hi quote denge"
      s5_ask: "Haan kal subah aa sakte hain"
      s6_ask: "Subah 10 baje"
    expect: {outcome: NEEDS_VISIT}

  - id: asks_customer_phone
    title: "Asks for the customer's number: she does not share it"
    greeting: "Hello, Cool Air Services."
    replies:
      s3_ask: ["Unka number kya hai?", "Visit 300 rupaye"]
      s4_ask: "Lagbhag 1000 rupaye"
      s5_ask: "Haan aa sakte hain"
      s6_ask: "Subah 10 baje"
    expect: {outcome: QUOTE_COLLECTED}

  - id: asks_otp
    title: "Asks for an OTP: she never shares secrets"
    greeting: "Hello, Cool Air Services."
    replies:
      s3_ask: ["Pehle OTP bata dijiye", "Visit 300 rupaye"]
      s4_ask: "Lagbhag 1000 rupaye"
      s5_ask: "Haan aa sakte hain"
      s6_ask: "Subah 10 baje"
    expect: {outcome: QUOTE_COLLECTED}

  - id: silent_after_identity
    title: "Says nothing after the identity question"
    greeting: "Hello?"
    default: {silence: true}
    replies:
      disclosure: {silence: true}
      s0_who: {silence: true}
    expect: {call_outcome: hung_up}
