# Simulated home-service vendors for `friday playbook dry-run home_service_visit --pending`.
# Replies are keyed by the PLAYBOOK LINE ID Friday last spoke (a list is used in order; a reply may
# be {say, hold_s, then, hangup, silence}): s3_ask (visit charge), s4_ask (rough estimate),
# s5_ask_date / s5_ask_open (can you come), s5b_ask (when then), s6_ask (arrival time),
# intro / intro_resume (the hook; the default answer is "Haan ji, bataiye"). `expect.outcome` is checked.
#
# The negotiate and confirm callbacks are modes (playbook_mode negotiate | confirm). The dry-run
# brief builder does not pass those modes yet (see the report), so those personas sit at the end
# of this file, commented out, and are covered by tests/playbooks/test_home_service_visit_script.py.

version: 1
playbook: home_service_visit

brief:
  user_first_name: Rahul
  honorific: sir
  services: "AC repair"
  business_name: "Cool Air Services"
  category: appliance_repair
  date_window: "kal subah"
  price_min: 50
  price_max: 3000
  estimate_max: 30000
  q_estimate: "yes"
  q_today: "yes"
  q_arrival: "yes"

personas:
  - id: preview_visit
    title: "Founder audio: visit charge, rough estimate, can come, arrival time"
    greeting: "Hello, Cool Air Services."
    replies:
      s3_ask: "Visit charge 300 rupaye hai"
      s4_ask: "Kaam 800 se 1500 rupaye tak aa jata hai"
      s5_ask_date: "Haan kal subah aa sakte hain"
      s6_ask: "Subah 10 se 12 baje ke beech"
    expect: {outcome: QUOTE_COLLECTED}

  - id: preview_visit_on_site
    title: "Founder audio: they can only estimate after seeing it"
    greeting: "Hello, Cool Air Services."
    replies:
      s3_ask: "Visit charge 300 rupaye hai"
      s4_ask: "Dekhne ke baad hi bata sakte hain"
      s5_ask_date: "Haan kal subah aa sakte hain"
      s6_ask: "Subah 11 baje tak"
    expect: {outcome: QUOTE_COLLECTED}

  - id: preview_cannot_come
    title: "Founder audio: they cannot come that day, she asks until when"
    greeting: "Hello, Cool Air Services."
    replies:
      s3_ask: "Visit charge 300 rupaye hai"
      s4_ask: "Lagbhag 1000 rupaye"
      s5_ask_date: "Kal subah nahi ho payega"
      s5b_ask: "Parso subah tak aa sakte hain"
    expect: {outcome: QUOTE_COLLECTED}

  - id: visit_free
    title: "The visit is free (no charge)"
    greeting: "Hello, Cool Air Services."
    replies:
      s3_ask: "Visit free hai ji, kaam ke paise lagte hain"
      s4_ask: "Lagbhag 1000 rupaye"
      s5_ask_date: "Haan aa sakte hain"
      s6_ask: "Dopahar mein"
    expect: {outcome: QUOTE_COLLECTED}

  - id: visit_charge_adjusted
    title: "Visit charge adjusted in the work"
    greeting: "Hello, Cool Air Services."
    replies:
      s3_ask: "300 rupaye visit ka, kaam mein adjust ho jata hai"
      s4_ask: "Lagbhag 1200 rupaye"
      s5_ask_date: "Haan kal ho jayega"
      s6_ask: "Subah 10 baje"
    expect: {outcome: QUOTE_COLLECTED}

  - id: open_day_no_date_window
    title: "The user named no day: she asks aaj ya kal"
    greeting: "Hello, Cool Air Services."
    brief: {date_window: ""}
    replies:
      s3_ask: "Visit 300 rupaye"
      s4_ask: "Lagbhag 1000 rupaye"
      s5_ask_date: "Haan aaj shaam aa sakte hain"
      s6_ask: "Shaam 5 baje"
    expect: {outcome: QUOTE_COLLECTED}

  - id: estimate_in_words
    title: "Estimate said in words (do se dhai hazaar)"
    greeting: "Hello, Cool Air Services."
    replies:
      s3_ask: "Teen sau rupaye lagte hain visit ke"
      s4_ask: "Do hazaar se dhai hazaar rupaye tak"
      s5_ask_date: "Haan kal subah aa sakte hain"
      s6_ask: "Subah 9 baje"
    expect: {outcome: QUOTE_COLLECTED}

  - id: per_hour_unit
    title: "Carpenter: hourly rate (per-unit price)"
    greeting: "Hello, Wood Works."
    brief: {services: "furniture repair", business_name: "Wood Works", category: home_repair}
    replies:
      s3_ask: "Visit ka kuch nahi, hourly 400 rupaye lagte hain"
      s4_ask: "Dekh ke hi bata sakte hain"
      s5_ask_date: "Haan kal aa sakte hain"
      s6_ask: "Subah 10 baje"
    expect: {outcome: QUOTE_COLLECTED}

  - id: per_sqft_estimate
    title: "Painter: rate per square foot as the estimate"
    greeting: "Hello, Rang Painters."
    brief: {services: "painting 2 BHK", business_name: "Rang Painters", category: home_repair, price_min: 0, estimate_max: 200000}
    replies:
      s3_ask: "Visit free hai, survey ke baad quote denge"
      s4_ask: "12 rupaye per square feet lagta hai"
      s5_ask_date: "Haan kal aa sakte hain"
      s6_ask: "Subah 11 baje"
    expect: {outcome: QUOTE_COLLECTED}

  - id: visit_needed_for_everything
    title: "'Dekh ke hi bata sakte hain' for everything"
    greeting: "Hello, Cool Air Services."
    replies:
      s3_ask: "Dekh ke hi bata sakte hain"
      s4_ask: "Dekhne ke baad hi estimate denge"
      s5_ask_date: "Haan aa sakte hain"
      s6_ask: "Subah"
    expect: {outcome: NEEDS_VISIT}

  # ---------------------------------------------------------------- packers and movers
  - id: movers_asks_quantity_from_to_floor
    title: "Packers: they ask the quantity, from, to and floor; answered from the user's facts"
    greeting: "Hello, Safe Movers."
    brief: &movers {services: "ghar shifting", business_name: "Safe Movers", category: packers_movers, date_window: "agle hafte", price_min: 0, price_max: 2000, estimate_max: 150000, items_description: "2 BHK ka saaman", from_place: Vaishali, to_place: Indirapuram, floor_info: "teesri floor, lift hai"}
    replies:
      s3_ask: ["Pehle bataiye kitna saaman hai, kahan se kahan jana hai, kitni floor par hai?", "Visit ka kuch nahi lagta"]
      s4_ask: "Lagbhag 12000 rupaye aa jata hai"
      s5_ask_date: "Haan agle hafte aa sakte hain"
      s6_ask: "Subah 10 baje"
    expect: {outcome: QUOTE_COLLECTED}

  - id: movers_asks_a_fact_the_user_did_not_give
    title: "Packers ask the floor but the user gave none: she asks the user"
    greeting: "Hello, Safe Movers."
    brief: {<<: *movers, items_description: "", floor_info: ""}
    replies:
      s3_ask: ["Kitna saaman hai, kitni floor par hai?", "Visit free hai"]
      s4_ask: "Lagbhag 12000 rupaye"
      s5_ask_date: "Haan"
      s6_ask: "Subah"
    expect: {outcome: QUOTE_COLLECTED}

  - id: movers_asks_at_the_estimate
    title: "Packers ask at the estimate question"
    greeting: "Hello, Safe Movers."
    brief: *movers
    replies:
      s3_ask: "Visit free hai"
      s4_ask: ["Saaman kitna hai, kahan se kahan?", "Theek hai, 12000 rupaye lagega"]
      s5_ask_date: "Haan"
      s6_ask: "Subah"
    expect: {outcome: QUOTE_COLLECTED}

  # ---------------------------------------------------------------- WhatsApp
  - id: whatsapp_same_number
    title: "WhatsApp pe photo bhej do: yahi number hai"
    greeting: "Hello, Cool Air Services."
    replies:
      s3_ask: "WhatsApp pe problem ki photo bhej do"
      wa_ask: "Yahi number hai"
    expect: {outcome: WHATSAPP_REQUESTED}

  - id: whatsapp_gives_number_confirmed
    title: "Gives digits, she reads them back, yes"
    greeting: "Hello, Cool Air Services."
    replies:
      s3_ask: "WhatsApp pe bhej dijiye"
      wa_ask: "98111 22334"
      wa_read: "Haan ji sahi hai"
    expect: {outcome: WHATSAPP_REQUESTED}

  - id: whatsapp_number_corrected
    title: "The read-back is wrong: she asks once more"
    greeting: "Hello, Cool Air Services."
    replies:
      s3_ask: "WhatsApp pe bhej dijiye"
      wa_ask: ["98111 22334", "98111 22335"]
      wa_read: ["Nahi nahi, galat hai", "Haan ji sahi hai"]
    expect: {outcome: WHATSAPP_REQUESTED}

  - id: whatsapp_after_price
    title: "Visit charge said, then WhatsApp for the rest"
    greeting: "Hello, Cool Air Services."
    replies:
      s3_ask: "Visit charge 300 rupaye hai"
      s4_ask: "WhatsApp pe photo bhej do, wahin se bata denge"
      wa_ask: "Yahi number hai"
    expect: {outcome: QUOTE_COLLECTED}

  - id: whatsapp_no_whatsapp
    title: "No WhatsApp: she asks them to say it here, they do"
    greeting: "Hello, Cool Air Services."
    replies:
      s3_ask: ["WhatsApp pe photo bhej do", "Achha, visit 300 rupaye hai"]
      wa_ask: "Nahi, mere paas nahi hai"
      s4_ask: "Lagbhag 1000 rupaye"
      s5_ask_date: "Haan"
      s6_ask: "Subah"
    expect: {outcome: QUOTE_COLLECTED}

  - id: whatsapp_insists_no_number
    title: "Insists on WhatsApp but gives no number"
    greeting: "Hello, Cool Air Services."
    replies:
      s3_ask: "WhatsApp pe bhej do"
      wa_ask: ["WhatsApp pe hi bhej do", "Bhej do na"]
    expect: {outcome: WHATSAPP_REQUESTED}

  # ---------------------------------------------------------------- advance
  - id: advance_raised_by_business
    title: "The business raises an advance: she asks the amount and hands it to the user"
    greeting: "Hello, Cool Air Services."
    replies:
      s3_ask: "Visit charge 300 rupaye hai"
      s4_ask: "Kaam ke liye pehle advance dena padega"
      adv_ask_biz: "500 rupaye advance lagega"
    expect: {outcome: ADVANCE_ASKED}

  - id: advance_before_visit_charge
    title: "Advance is raised before the visit charge"
    greeting: "Hello, Cool Air Services."
    replies:
      s3_ask: "Pehle booking amount dena padega"
      adv_ask_biz: "500 rupaye"
    expect: {outcome: ADVANCE_ASKED}

  - id: advance_asked_by_user_request
    title: "The user's request asks for the booking amount: she asks at the end"
    greeting: "Hello, Safe Movers."
    brief: {<<: *movers, q_ask_advance: "yes"}
    replies:
      s3_ask: "Visit free hai"
      s4_ask: "Lagbhag 12000 rupaye"
      s5_ask_date: "Haan"
      s6_ask: "Subah 10 baje"
      adv_ask_user: "2000 rupaye booking amount lagega"
    expect: {outcome: QUOTE_COLLECTED}

  # ---------------------------------------------------------------- calls that go sideways
  - id: busy_callback
    title: "On a job: she asks when to call; the time is noted"
    greeting: "Hello, Cool Air Services."
    replies:
      s3_ask: "Abhi busy hain, baad mein call karna"
      busy_when: "Ek ghante baad"
    expect: {outcome: CALL_BACK_LATER}

  - id: busy_at_hook
    title: "Busy straight after the hook"
    greeting: "Hello, Cool Air Services."
    replies:
      intro: "Abhi busy hoon, baad mein call karo"
      busy_when: "Shaam ko"
    expect: {outcome: CALL_BACK_LATER}

  - id: puts_on_hold
    title: "Puts Friday on hold, then continues"
    greeting: "Hello, Cool Air Services."
    replies:
      s3_ask: [{say: "Ek minute hold kijiye", hold_s: 20, then: "Haan boliye, kya poochh rahi thi?"}, "Visit 300 rupaye"]
      s4_ask: "Lagbhag 1000 rupaye"
      s5_ask_date: "Haan"
      s6_ask: "Subah"
    expect: {outcome: QUOTE_COLLECTED}

  - id: hold_too_long
    title: "Hold and never comes back"
    greeting: "Hello, Cool Air Services."
    replies:
      s3_ask: {say: "Ek minute ruko", hold_s: 300, then: "Haan boliye"}
    expect: {call_outcome: hold_timeout}

  - id: wrong_number
    title: "Wrong number (says so at the identity question)"
    greeting: "Hello?"
    replies:
      disclosure: "Nahi, yeh toh restaurant hai, wrong number"
    expect: {outcome: WRONG_NUMBER}

  - id: wrong_number_later
    title: "Wrong number (said after the hook)"
    greeting: "Hello, Cool Air Services."
    replies:
      s3_ask: "Yeh repair ki dukaan nahi hai, galat number lagaya hai aapne"
    expect: {outcome: WRONG_NUMBER}

  - id: rude_hangs_up
    title: "Rude, then hangs up"
    greeting: "Hello, Cool Air Services."
    replies:
      s3_ask: {say: "Faltu mein tang mat karo, bakwas band karo", hangup: true}
    expect: {outcome: REFUSED}

  - id: dnc_request
    title: "Asks not to be called again"
    stop_request: true
    greeting: "Hello, Cool Air Services."
    replies:
      s3_ask: "Dobara call mat karna, number hata do"
    expect: {outcome: REFUSED}

  - id: ai_robot_at_identity
    title: "Asks 'robot hai kya?' instead of answering the identity question"
    greeting: "Hello?"
    replies:
      disclosure: "Yeh robot hai kya?"
      s3_ask: "Visit 300 rupaye"
      s4_ask: "Lagbhag 1000 rupaye"
      s5_ask_date: "Haan"
      s6_ask: "Subah"
    expect: {outcome: QUOTE_COLLECTED}

  - id: ai_insaan_at_visit_charge
    title: "Asks 'insaan ho ya machine?' at the visit charge"
    greeting: "Hello, Cool Air Services."
    replies:
      s3_ask: ["Aap insaan ho ya machine?", "Visit 300 rupaye"]
      s4_ask: "Lagbhag 1000 rupaye"
      s5_ask_date: "Haan"
      s6_ask: "Subah"
    expect: {outcome: QUOTE_COLLECTED}

  - id: ai_asked_in_english
    title: "Are you an AI? (English)"
    greeting: "Hello, Cool Air Services."
    replies:
      s3_ask: ["Is this an AI?", "300 rupees"]
      s4_ask: "1000 rupees"
      s5_ask_date: "Yes"
      s6_ask: "Morning"
    expect: {outcome: QUOTE_COLLECTED}

  - id: asks_customer_phone
    title: "Asks for the customer's number; she does not share it"
    greeting: "Hello, Cool Air Services."
    replies:
      s3_ask: ["Unka number kya hai?", "Visit 300 rupaye"]
      s4_ask: "Lagbhag 1000 rupaye"
      s5_ask_date: "Haan"
      s6_ask: "Subah"
    expect: {outcome: QUOTE_COLLECTED}

  - id: asks_otp
    title: "Asks for an OTP; she never shares secrets"
    greeting: "Hello, Cool Air Services."
    replies:
      s3_ask: ["Pehle OTP bata dijiye", "Visit 300 rupaye"]
      s4_ask: "Lagbhag 1000 rupaye"
      s5_ask_date: "Haan"
      s6_ask: "Subah"
    expect: {outcome: QUOTE_COLLECTED}

  - id: noisy_then_clear
    title: "Noisy line, clear after the re-ask"
    greeting: "Hello?"
    replies:
      s3_ask: ["kkh... hmm...", "Visit 300 rupaye"]
      s4_ask: "Lagbhag 1000 rupaye"
      s5_ask_date: "Haan"
      s6_ask: "Subah"
    expect: {outcome: QUOTE_COLLECTED}

  - id: asks_who_first
    title: "Asks who is calling before the identity question"
    greeting: "Hello?"
    replies:
      disclosure: "Kaun bol raha hai?"
      s0_who: "Haan ji, yahi Cool Air Services hai, boliye"
      s3_ask: "Visit 300 rupaye"
      s4_ask: "Lagbhag 1000 rupaye"
      s5_ask_date: "Haan"
      s6_ask: "Subah"
    expect: {outcome: QUOTE_COLLECTED}

  - id: asks_who_at_the_hook
    title: "Kaun bol raha hai at the hook"
    greeting: "Hello?"
    replies:
      intro: ["Kaun bol raha hai?", "Haan ji, bataiye"]
      s3_ask: "Visit 300 rupaye"
      s4_ask: "Lagbhag 1000 rupaye"
      s5_ask_date: "Haan"
      s6_ask: "Subah"
    expect: {outcome: QUOTE_COLLECTED}

  - id: silent_after_identity
    title: "Says nothing after the identity question"
    greeting: "Hello?"
    default: {silence: true}
    replies:
      disclosure: {silence: true}
      s0_who: {silence: true}
    expect: {call_outcome: hung_up}

  # ---------------------------------------------------------------- a retry call (resume)
  - id: resume_after_visit_charge
    title: "Retry: the visit charge is known, so she opens with the retry hook and asks the rest"
    greeting: "Hello, Cool Air Services."
    brief: {resume: "yes", prior_price_inr: 300}
    replies:
      intro_resume: "Haan ji, bataiye"
      s4_ask: "Lagbhag 1000 rupaye"
      s5_ask_date: "Haan"
      s6_ask: "Subah"
    expect: {outcome: QUOTE_COLLECTED}

  - id: resume_charge_and_estimate_known
    title: "Retry: charge and estimate known, only the visit day and time are asked"
    greeting: "Hello, Cool Air Services."
    brief: {resume: "yes", prior_price_inr: 300, prior_estimate_inr: 1000}
    replies:
      intro_resume: "Haan ji, bataiye"
      s5_ask_date: "Haan"
      s6_ask: "Subah"
    expect: {outcome: QUOTE_COLLECTED}

