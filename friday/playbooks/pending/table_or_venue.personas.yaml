# Simulated restaurants / banquets / hotels for `friday playbook dry-run table_or_venue --pending`.
# Format: see friday/playbooks/data/salon_booking.personas.yaml. Replies are keyed by the line id
# Friday last spoke: s3_ask (the rate), s2_ask (available?), s2f_ask, s2b_ask, s2_ask_time.
# `preview_*` personas feed `friday playbook preview table_or_venue --pending`.

version: 1
playbook: table_or_venue

brief:
  user_first_name: Rahul
  honorific: sir
  services: "table"
  party_size: 4
  date_window: "aaj raat 8 baje"
  unit_phrase: "per head ka kharcha"
  business_name: "Spice Garden Restaurant"
  category: restaurant
  price_min: 100
  price_max: 5000

personas:
  - id: preview_table_quote
    title: "Founder audio: restaurant, rate and availability reported (no booking)"
    greeting: "Hello, Spice Garden."
    replies:
      s3_ask: "Lagbhag 600 rupaye per head"
      s2_ask: "Haan ji, table mil jayegi"
    expect: {outcome: SLOT_OFFERED}

  - id: preview_table_book
    title: "Founder audio: delegated table booking, free and within the ceiling"
    greeting: "Hello, Spice Garden."
    brief: {delegation_max_price: 800}
    replies:
      s3_ask: "Lagbhag 600 rupaye per head"
      s2_ask: "Haan ji, ho jayega"
    expect: {outcome: BOOKED}

  - id: preview_banquet
    title: "Founder audio: banquet, rate per plate, available"
    greeting: "Hello, Grand Banquet."
    brief: {services: "banquet", party_size: 150, date_window: "parso shaam", unit_phrase: "per plate ka rate", business_name: "Grand Banquet", category: banquet_hall, price_min: 200, price_max: 5000}
    replies:
      s3_ask: "Veg 900 aur non veg 1200 rupaye per plate"
      s2_ask: "Haan, parso available hai"
    expect: {outcome: QUOTE_COLLECTED}

  - id: preview_hotel_room
    title: "Founder audio: hotel room, rate per night, available"
    greeting: "Hello, Hotel Sunrise."
    brief: {services: "deluxe room", party_size: 2, date_window: "kal", unit_phrase: "ek raat ka room rate", business_name: "Hotel Sunrise", category: hotel_room, price_min: 500, price_max: 30000}
    replies:
      s3_ask: "Deluxe 3500 rupaye per night, GST alag"
      s2_ask: "Haan kal available hai"
    expect: {outcome: QUOTE_COLLECTED}

  - id: cafe_walk_in_only
    title: "Cafe: no reservations, just walk in"
    greeting: "Hello, Brew Cafe."
    brief: {services: "table", business_name: "Brew Cafe", category: cafe, unit_phrase: "per head ka kharcha"}
    replies:
      s3_ask: "Lagbhag 400 rupaye per head"
      s2_ask: "Walk-in hi hota hai, aa jaiye"
    expect: {outcome: QUOTE_COLLECTED}

  - id: room_rate_range
    title: "A range of room rates: the upper number is kept, with the lower"
    greeting: "Hello, Hotel Sunrise."
    brief: {services: "room", party_size: 2, date_window: "kal", unit_phrase: "ek raat ka room rate", business_name: "Hotel Sunrise", category: hotel_room, price_min: 500, price_max: 30000}
    replies:
      s3_ask: "2500 se 4000 rupaye tak, room ke hisaab se"
      s2_ask: "Haan available hai"
    expect: {outcome: QUOTE_COLLECTED}

  - id: price_depends_menu
    title: "'Menu pe depend karta hai': no rate, availability still asked"
    greeting: "Hello, Grand Banquet."
    brief: {services: "banquet", party_size: 150, date_window: "parso shaam", unit_phrase: "per plate ka rate", business_name: "Grand Banquet", category: banquet_hall, price_min: 200, price_max: 5000}
    replies:
      s3_ask: "Menu pe depend karta hai"
      s2_ask: "Haan available hai"
    expect: {outcome: PRICE_ON_REQUEST}

  - id: banquet_visit_needed
    title: "Banquet: come and see the hall, then the rate"
    greeting: "Hello, Grand Banquet."
    brief: {services: "banquet", party_size: 150, date_window: "parso shaam", unit_phrase: "per plate ka rate", business_name: "Grand Banquet", category: banquet_hall, price_min: 200, price_max: 5000}
    replies:
      s3_ask: "Aake hall dekh lijiye, phir rate batayenge"
      s2_ask: "Haan available hai"
    expect: {outcome: PRICE_ON_REQUEST}

  - id: banquet_advance_with_rate
    title: "Banquet asks an advance with the rate; she does not agree, the rate is kept"
    greeting: "Hello, Grand Banquet."
    brief: {services: "banquet", party_size: 150, date_window: "parso shaam", unit_phrase: "per plate ka rate", business_name: "Grand Banquet", category: banquet_hall, price_min: 200, price_max: 5000}
    replies:
      s3_ask: "900 rupaye per plate, 20000 advance lagega"
      s2_ask: "Haan available hai"
    expect: {outcome: QUOTE_COLLECTED}

  - id: table_full_other_time
    title: "Full at that time, offers another"
    greeting: "Hello, Spice Garden."
    replies:
      s3_ask: "Lagbhag 600 rupaye per head"
      s2_ask: "Aaj raat 8 baje to full hai"
      s2b_ask: "9 baje ka ho sakta hai"
    expect: {outcome: SLOT_OFFERED}

  - id: table_nothing_free
    title: "Nothing free at all"
    greeting: "Hello, Spice Garden."
    replies:
      s3_ask: "Lagbhag 600 rupaye per head"
      s2_ask: "Full hai"
      s2b_ask: "Aaj koi table nahi hai"
    expect: {outcome: NO_SLOT}

  - id: whatsapp_menu_then_rate
    title: "'WhatsApp pe menu bhej do', then says the rate"
    greeting: "Hello, Spice Garden."
    replies:
      s3_ask: ["WhatsApp pe menu bhej do", "Theek hai, 600 rupaye per head"]
      s2_ask: "Haan ho jayega"
    expect: {outcome: SLOT_OFFERED}

  - id: whatsapp_insists
    title: "Insists on WhatsApp: polite close, flagged"
    greeting: "Hello, Spice Garden."
    replies:
      s3_ask: ["WhatsApp pe menu bhej do", "Nahi, WhatsApp pe hi bhej do"]
    expect: {outcome: WHATSAPP_REQUESTED}

  - id: busy_callback
    title: "Rush hour, call later"
    greeting: "Hello, Spice Garden."
    replies:
      s3_ask: "Abhi busy hain, baad mein call karna"
    expect: {outcome: CALL_BACK_LATER}

  - id: puts_on_hold
    title: "Goes to check the bookings: hold, then answers"
    greeting: "Hello, Spice Garden."
    replies:
      s3_ask: [{say: "Ek minute hold kijiye", hold_s: 25, then: "Haan boliye, kya poochh rahi thi?"}, "600 rupaye per head"]
      s2_ask: "Haan ji, table mil jayegi"
    expect: {outcome: SLOT_OFFERED}

  - id: wrong_number
    title: "Wrong number at the identity question"
    greeting: "Hello?"
    replies:
      disclosure: "Nahi, yeh toh salon hai, wrong number"
    expect: {outcome: WRONG_NUMBER}

  - id: rude_hangs_up
    title: "Rude, then hangs up"
    greeting: "Hello, Spice Garden."
    replies:
      s3_ask: {say: "Faltu mein tang mat karo, bakwas band karo", hangup: true}
    expect: {outcome: REFUSED}

  - id: dnc_request
    title: "Asks not to be called again"
    stop_request: true
    greeting: "Hello, Spice Garden."
    replies:
      s3_ask: "Dobara call mat karna, number hata do"
    expect: {outcome: REFUSED}

  - id: ai_robot_at_identity
    title: "Asks 'robot hai kya?' at the identity question"
    greeting: "Hello?"
    replies:
      disclosure: "Yeh robot hai kya?"
      s3_ask: "600 rupaye per head"
      s2_ask: "Haan ji, ho jayega"
    expect: {outcome: SLOT_OFFERED}

  - id: ai_asked_at_availability
    title: "Asks 'AI ho?' at the availability question"
    greeting: "Hello, Spice Garden."
    replies:
      s3_ask: "600 rupaye per head"
      s2_ask: ["Aap AI ho kya?", "Haan ji, ho jayega"]
    expect: {outcome: SLOT_OFFERED}

  - id: refuses_rate
    title: "No rate on the phone"
    greeting: "Hello, Spice Garden."
    replies:
      s3_ask: "Phone par rate nahi batate"
      s2_ask: "Haan ji, table mil jayegi"
    expect: {outcome: SLOT_OFFERED}

  - id: absurd_rate_asked_again
    title: "9000 per head is not trusted: she asks again"
    greeting: "Hello, Spice Garden."
    replies:
      s3_ask: ["9000 rupaye per head", "Sorry, 900 rupaye per head"]
      s2_ask: "Haan ji, ho jayega"
    expect: {outcome: SLOT_OFFERED}

  - id: asks_customer_phone
    title: "Asks for the customer's number: she does not share it"
    greeting: "Hello, Spice Garden."
    replies:
      s3_ask: ["Unka number kya hai?", "600 rupaye per head"]
      s2_ask: "Haan ji, ho jayega"
    expect: {outcome: SLOT_OFFERED}

  - id: asks_otp
    title: "Asks for an OTP: she never shares secrets"
    greeting: "Hello, Spice Garden."
    replies:
      s3_ask: ["Pehle OTP bata dijiye", "600 rupaye per head"]
      s2_ask: "Haan ji, ho jayega"
    expect: {outcome: SLOT_OFFERED}

  - id: noisy_then_clear
    title: "Noisy line, clear after the re-ask"
    greeting: "Hello?"
    replies:
      s3_ask: ["kkh... hmm...", "600 rupaye per head"]
      s2_ask: "Haan ji, ho jayega"
    expect: {outcome: SLOT_OFFERED}

  - id: book_busy_fallback_accepted
    title: "Delegated: today full, tomorrow free: books the fallback"
    greeting: "Hello, Spice Garden."
    brief: {delegation_max_price: 800, fallback_when: kal raat 8 baje}
    replies:
      s3_ask: "600 rupaye per head"
      s2_ask: "Aaj raat 8 baje to full hai"
      s2f_ask: "Haan kal ho jayega"
    expect: {outcome: BOOKED}

  - id: book_rate_over_ceiling
    title: "Delegated, but the rate is above the ceiling: no booking, asks the owner"
    greeting: "Hello, Spice Garden."
    brief: {delegation_max_price: 500}
    replies:
      s3_ask: "900 rupaye per head"
      s2_ask: "Haan ji, ho jayega"
    expect: {outcome: SLOT_OFFERED}

  - id: book_mode_without_delegation
    title: "Book asked for but no delegation: stays a quote"
    greeting: "Hello, Spice Garden."
    brief: {mode: book}
    replies:
      s3_ask: "600 rupaye per head"
      s2_ask: "Haan ji, ho jayega"
    expect: {outcome: SLOT_OFFERED}

  - id: book_nothing_free
    title: "Delegated, nothing free"
    greeting: "Hello, Spice Garden."
    brief: {delegation_max_price: 800}
    replies:
      s3_ask: "600 rupaye per head"
      s2_ask: "Full hai"
      s2b_ask: "Aaj koi table nahi hai"
    expect: {outcome: NO_SLOT}

  - id: silent_after_identity
    title: "Says nothing after the identity question"
    greeting: "Hello?"
    default: {silence: true}
    replies:
      disclosure: {silence: true}
      s0_who: {silence: true}
    expect: {call_outcome: hung_up}
