# PENDING v7 (founder script review 13 Oct 2026; docs/SCRIPTS_SPEC.md section 6).
# PENDING playbook: stock_and_price (archetype). NOT loaded by production (`select`, calls).
# Lives in friday/playbooks/pending/ until the founder has HEARD the audio and approved it
# (hear-before-change). Promote only with: friday playbook promote stock_and_price
# (needs the founder's marker file stock_and_price.approved next to this file).
#
# Electronics dealer and florist/gift. Flow: stock question -> price (or "kab tak aa jayega" when
# not in stock) -> [q_extras: warranty] -> [q_exchange: exchange with answers from old_phone_*]
# -> [q_delivery: florist home delivery] -> [q_ask_advance: booking amount] -> price-check close.
# NO negotiation for electronics (only q_negotiate=yes, e.g. florist, enables mode negotiate).
# Modes (playbook_mode): quote_only (default) | negotiate | confirm (the HOLD line).
# Question switches (category pack): q_extras=yes -> warranty (electronics); q_exchange=yes ->
# exchange (electronics, when the user wants it); q_delivery=yes -> home delivery (florist);
# q_ask_advance=yes -> ask the booking amount (only if the USER's request asks for it).
# A booking payment raised by the business: she asks the amount, takes the shop's UPI number
# (read back) or sends a WhatsApp for QR / bank details (number captured and read back); no
# WhatsApp: the details are said on the call. The USER pays; Friday never pays.

version: 1
id: stock_and_price
archetype: stock_and_price
title: Stock and price (electronics dealer, florist / gift)
language: hinglish

inputs:
  user_first_name: {required: true}
  user_spoken: {}
  honorific: {default: sir}
  business_name: {required: true}
  business_name_spoken: {}
  service: {required: true}
  services: {}
  services_spoken: {}
  playbook_mode: {default: quote_only}
  price_min: {}              # category sanity range: a price outside it is not trusted
  price_max: {}
  estimate_max: {}
  category: {}
  q_delivery: {default: "no"}
  q_extras: {default: "no"}
  q_exchange: {default: "no"}
  q_ask_advance: {default: "no"}
  q_negotiate: {default: "no"}
  resume: {}
  prior_price_inr: {}
  prior_estimate_inr: {}
  prior_slot: {}
  prior_notes: {}
  prior_flags: {}
  old_phone_model: {}
  old_phone_year: {}
  old_phone_condition: {}
  delivery_area: {}
  time: {}
  target_price: {}
  max_price: {}
  user_full_name: {}
  user_full_spoken: {}

outputs: [price_inr, estimate_inr, in_stock, out_of_stock, delivery, advance_needed, whatsapp_requested, captured_number, outcome]

limits:
  max_duration_s: 200
  max_repeats: 4
  max_unclear_per_step: 2
  hold_max_s: 60
  max_turns: 36

disclosure: disclosure
ai_disclosure: on_request
reintro: reintro

confusion:
  line: sorry
  outcome: UNCLEAR
  close: bye_unclear

lines:
  disclosure: "Hello, kya meri baat {business_name_spoken} se ho rahi hai?"
  reintro: "Ji, main Friday hoon, {user_spoken} {honorific} ki virtual assistant."
  s0_who: "Ji, main Friday hoon, {user_spoken} {honorific} ki virtual assistant. Kya meri baat {business_name_spoken} se ho rahi hai?"
  recording_notice: "Yeh call quality ke liye record ho sakta hai."
  # the HOOK: one short line, then WAIT for "haan ji, bataiye"
  intro: "Ji sir, actually maine aapko {services_spoken} ke regarding call kiya tha."
  intro_resume: "Ji sir, actually maine pehle {services_spoken} ke regarding call kiya tha, bas ek-do cheezein reh gayi thi."
  s2_ask_first: "Toh sir, {services_spoken} aapke paas available hoga?"
  s2_ask: "Sir, {services_spoken} aapke paas available hoga?"
  s3_ask_first: "{ack}, toh iska estimated kya price rahega?"
  s3_ask: "Sir, iska estimated kya price rahega?"
  s4_ask: "{ack}, kab tak aa jayega?"
  s5_ask: "{ack}, aur isme warranty kitni mil jayegi?"
  s6_ask: "{ack}, aur hamare paas purana phone hai exchange ke liye, uska koi offer mil jayega?"
  s6b_ask: "Toh sir, exchange mein uska kitna milega, aur final price kitna padega?"
  ex_model: "Ji, {old_phone_model} hai."
  ex_year: "Aur {old_phone_year} ka hai."
  ex_cond: "Aur wo {old_phone_condition}."
  s7d_ask: "{ack}, aap home delivery provide karte ho kya?"
  delivery_area_line: "Ji, {delivery_area} mein."
  s7a_ask: "Achha theek hai sir, ek baar booking amount kitna lenge?"
  q_close: "{ack}, main ek baar {user_spoken} {honorific} ko bata deti hoon, aur thodi der mein aapko confirm karke batati hoon."
  # confirmation call (mode confirm): the HOLD line
  # APPROVED text + glue "Thank you." at the end (natural ending)
  hold:
    text: "{user_spoken} {honorific} ne confirm kar diya hai, toh ek baar aap hamare liye {services_spoken} hold kar dijiye {user_spoken} ke naam se, woh {slot_time} tak aake pick kar lenge. Thank you."
    commit: true
  s7_close: "{ack}, main {user_spoken} {honorific} se confirm karke aapko thodi der mein call back karti hoon. Thank you."
  # negotiation callback (mode negotiate, only when q_negotiate)
  n_push1: "Toh sir, {user_spoken} {honorific} se baat ho gayi hai, price thoda humare budget se upar hai. Humara budget {target_price} ka hai, toh isme bataiye kuch ho sakta hai kya?"
  n_push2: "Achha sir, thoda aur dekh lijiye na, kya {push2_price} tak ho payega?"
  n_close: "Theek hai sir, main ek baar {user_spoken} {honorific} se final confirmation leke aapko call back karti hoon."
  # WhatsApp pe bhej do (rule 5): number, read-back, done
  w_ask: "Theek hai sir, ek baar aap please WhatsApp ka number confirm kar sakte hain?"
  w_readback: "{captured_spoken}, yahi number hai na?"
  w_done: "Okay sir, main aapko WhatsApp kar deti hoon."
  w_none: "Achha sir, toh aap yahin bata dijiye please."
  # a booking payment (rule 6); the user pays the business directly
  p_amount: "{ack}, ek baar advance ya booking amount kitna hoga?"
  p_upi_ask: "Theek hai sir, aap apna UPI number de dijiye, main {user_spoken} {honorific} ko bolke aapko ek baar booking amount pay kara deti hoon."
  p_wa_ask: "Theek hai sir, main aapko ek baar WhatsApp message kar deti hoon, isi number pe WhatsApp karna hai ya kuch aur?"
  p_wa_done: "Theek hai sir, main aapko is number pe WhatsApp kar deti hoon, aap bank details bhej dijiye, {user_spoken} {honorific} aapko pay kar denge."
  p_here: "Theek hai sir, aap payment details yahin bata dijiye please."
  p_close: "Theek hai sir, main ek baar {user_spoken} {honorific} ko bata deti hoon, wo aapko advance payment initiate kar denge. Thank you."
  ai_yes: "Ji, haan, main {user_spoken} {honorific} ki personal AI assistant hoon."
  busy_ask: "Ji koi baat nahi sir, main kab call kar sakti hoon?"
  bye_later: "Theek hai sir, thank you."
  bye_wrong: "Ji maaf kijiye, galat number lag gaya. Thank you."
  bye_dnc: "Ji theek hai, hum dobara call nahi karenge. Thank you."
  bye_rude: "Ji maaf kijiye, pareshan karne ke liye. Thank you."
  bye_unclear: "Ji maaf kijiye, awaaz saaf nahi aa rahi. Main baad mein call karti hoon. Thank you."
  no_number: "Ji, {user_spoken} {honorific} ka number main share nahi kar sakti."
  sorry: "Sorry, ek baar phir?"
  offscript: "Yeh main {user_spoken} {honorific} se poochh kar bataungi."
  no_secrets: "Ji, yeh jaankari main share nahi kar sakti."

routes:
  after_hook:
    - {when: [mode_confirm], goto: S8c}
    - {when: [mode_negotiate, q_negotiate], goto: N1}
    - {goto: S2}
  after_price:
    - {goto: S5}

defaults:
  STOP_CALLING: {say: [bye_dnc], outcome: REFUSED, set: {do_not_call: "yes"}}
  RUDE: {say: [bye_rude], outcome: REFUSED, set: {rude: "yes"}}
  WRONG_NUMBER: {say: [bye_wrong], outcome: WRONG_NUMBER, set: {wrong_number: "yes"}}
  BUSY_LATER: {goto: BT}
  ARE_YOU_BOT: {say: [ai_yes], repeat: true}
  WHO_IS_THIS: {say: [reintro], repeat: true, max_uses: 2}
  ASKS_REPEAT: {repeat: true, max_uses: 3}
  HOLD_ON: {hold_s: 60, max_uses: 3}
  ASKS_OFFTOPIC: {say: [offscript], repeat: true, max_uses: 3}
  ASKS_SECRET: {say: [no_secrets], repeat: true, max_uses: 2}
  ASKS_CUSTOMER_PHONE: {say: [no_number], repeat: true, max_uses: 2}
  NO_ADVANCE: {set: {advance_needed: "no"}, repeat: true, max_uses: 2}
  # the BUSINESS raises an advance / booking amount: ask how much, then take the payment details
  NEEDS_ADVANCE: {set: {advance_needed: "yes"}, goto: P1}
  # "WhatsApp pe bhej do": the WhatsApp number (read back), then the call closes
  WHATSAPP_PLEASE: {set: {whatsapp_requested: "yes"}, goto: W1}

start: S0
commit_step: S8c

steps:
  S0:
    branches:
      YES: {goto: S1}
      CONTINUE: {goto: S1}
      ACK: {goto: S1}
      NO: {say: [bye_wrong], outcome: WRONG_NUMBER, set: {wrong_number: "yes"}}
      WHO_IS_THIS: {say: [s0_who], stay: true, max_uses: 2}
      ASKS_REPEAT: {say: [s0_who], stay: true, max_uses: 2}
      ARE_YOU_BOT: {say: [ai_yes], goto: S1}
      ASKS_OFFTOPIC: {say: [s0_who], stay: true}
      ASKS_SECRET: {say: [s0_who], stay: true}
      ASKS_CUSTOMER_PHONE: {say: [s0_who], stay: true}
      WHATSAPP_PLEASE: {say: [s0_who], stay: true, max_uses: 1}

  S1:   # the HOOK; then wait for "haan ji, bataiye"
    ask:
      - {line: recording_notice, when: [recording, first_ask]}
      - {line: intro_resume, when: [is_resume]}
      - {line: intro, when: ["!is_resume"]}
    branches:
      YES: {goto: "@after_hook"}
      CONTINUE: {goto: "@after_hook"}
      ACK: {goto: "@after_hook"}
      ASKS_REPEAT: {repeat: true, max_uses: 1}
      ANY: {goto: "@after_hook"}

  S2:   # stock
    skip_when: [price_known]
    ask:
      - {line: s2_ask_first, when: [first_ask]}
      - {line: s2_ask, when: ["!first_ask"]}
    branches:
      GIVES_PRICE:
        - {when: [price_known], set: {in_stock: "yes"}, goto: "@after_price"}
        - {set: {in_stock: "yes"}, goto: S3}
      PRICE_RANGE:
        - {when: [price_known], set: {in_stock: "yes"}, goto: "@after_price"}
        - {set: {in_stock: "yes"}, goto: S3}
      YES: {set: {in_stock: "yes"}, goto: S3}
      SLOT_FREE: {set: {in_stock: "yes"}, goto: S3}
      CONTINUE: {repeat: true}
      NO: {set: {out_of_stock: "yes"}, goto: S4}
      OUT_OF_STOCK: {set: {out_of_stock: "yes"}, goto: S4}
      SLOT_BUSY: {set: {out_of_stock: "yes"}, goto: S4}
      PRICE_DEPENDS: {goto: S3}
      ANY: {goto: S3}

  S3:   # in stock: the price
    skip_when: [price_known]
    ask:
      - {line: s3_ask_first, when: [first_ask]}
      - {line: s3_ask, when: ["!first_ask"]}
    branches:
      GIVES_PRICE:
        - {when: [price_known], goto: "@after_price"}
        - {repeat: true}
      PRICE_RANGE:
        - {when: [price_known], goto: "@after_price"}
        - {repeat: true}
      PRICE_DEPENDS: {set: {price_unknown: "yes"}, goto: "@after_price"}
      REFUSES_PRICE: {set: {price_unknown: "yes"}, goto: "@after_price"}
      VISIT_NEEDED: {set: {price_unknown: "yes"}, goto: "@after_price"}
      NO: {set: {out_of_stock: "yes"}, goto: S4}
      OUT_OF_STOCK: {set: {out_of_stock: "yes"}, goto: S4}
      CONTINUE: {repeat: true}
      YES: {repeat: true}
      ANY: {goto: "@after_price"}

  S4:   # not in stock: "kab tak aa jayega" (their words noted)
    max_visits: 1
    note: arrival
    ask: [s4_ask]
    branches:
      UNCLEAR: {goto: S7o}
      ANY: {goto: S7o}

  S5:   # electronics: warranty (their words noted)
    skip_when: ["!q_extras"]
    note: warranty
    ask: [s5_ask]
    branches:
      UNCLEAR: {goto: S6}
      ANY: {goto: S6}

  S6:   # exchange (only if the user wants it)
    skip_when: ["!q_exchange"]
    max_visits: 1
    captures: estimate
    note: exchange
    ask: [s6_ask]
    branches:
      ASKS_OFFTOPIC:
        - {when: [has_old_phone_model, has_old_phone_year, has_old_phone_condition], say: [ex_model, ex_year, ex_cond], goto: S6b, max_uses: 3}
        - {when: [has_old_phone_model, has_old_phone_year], say: [ex_model, ex_year], goto: S6b, max_uses: 3}
        - {when: [has_old_phone_model], say: [ex_model], goto: S6b, max_uses: 3}
        - {say: [offscript], goto: S6b, max_uses: 3}
      GIVES_PRICE: {goto: S7d}
      PRICE_RANGE: {goto: S7d}
      NO: {goto: S7d}
      YES: {goto: S6b}
      ACK: {goto: S6b}
      CONTINUE: {goto: S6b}
      SLOT_FREE: {goto: S6b}
      PRICE_DEPENDS: {goto: S6b}
      UNCLEAR: {goto: S6b}
      ANY: {goto: S7d}   # also where a skipped step goes

  S6b:  # what the old phone fetches and the final price
    skip_when: [estimate_known]
    captures: estimate
    note: exchange_final
    ask: [s6b_ask]
    branches:
      GIVES_PRICE: {goto: S7d}
      PRICE_RANGE: {goto: S7d}
      ASKS_OFFTOPIC:
        - {when: [has_old_phone_model, has_old_phone_year, has_old_phone_condition], say: [ex_model, ex_year, ex_cond], repeat: true, max_uses: 3}
        - {when: [has_old_phone_model, has_old_phone_year], say: [ex_model, ex_year], repeat: true, max_uses: 3}
        - {when: [has_old_phone_model], say: [ex_model], repeat: true, max_uses: 3}
        - {say: [offscript], repeat: true, max_uses: 3}
      UNCLEAR: {goto: S7d}
      ANY: {goto: S7d}

  S7d:  # florist: home delivery (the area only if asked)
    skip_when: ["!q_delivery"]
    max_visits: 1
    ask: [s7d_ask]
    branches:
      YES: {set: {delivery: "yes"}, goto: S7a}
      NO: {set: {delivery: pickup_only}, goto: S7a}
      ASKS_OFFTOPIC:
        - {when: [has_delivery_area], say: [delivery_area_line], repeat: true, max_uses: 2}
        - {say: [offscript], repeat: true, max_uses: 2}
      UNCLEAR: {goto: S7a}
      ANY: {goto: S7a}

  S7a:  # booking amount: ONLY when the user's request asks for it
    skip_when: ["!q_ask_advance"]
    max_visits: 1
    note: advance_amount
    ask: [s7a_ask]
    branches:
      UNCLEAR: {goto: S7q}
      ANY: {goto: S7q}

  S7q:  # price-check close (rule 11)
    final: true
    branches:
      ANY:
        - {when: [price_known], say: [q_close], outcome: QUOTE_COLLECTED}
        - {say: [q_close], outcome: PRICE_ON_REQUEST}

  S7o:  # not in stock: same close
    final: true
    branches:
      ANY:
        - {say: [q_close], outcome: OUT_OF_STOCK}

  # ---------------- busy: ask when to call back (their words noted), then close
  BT:
    max_visits: 1
    note: callback_time
    ask: [busy_ask]
    branches:
      UNCLEAR: {goto: BT2}
      ANY: {goto: BT2}

  BT2:
    final: true
    branches:
      ANY: {say: [bye_later], outcome: CALL_BACK_LATER}

  # ---------------- confirmation call: hold the item
  S8c:
    final: true
    branches:
      ANY:
        - {when: [can_commit], say: [hold], commit: true, outcome: BOOKED}
        - {say: [s7_close], outcome: HOLD_PENDING}

  # ---------------- negotiation callback (q_negotiate only; never above max_price)
  N1:
    max_visits: 1
    ask: [n_push1]
    branches:
      GIVES_PRICE:
        - {when: [price_known, price_le_target], goto: NF}
        - {goto: N2}
      PRICE_RANGE: {goto: N2}
      ANY: {goto: N2}

  N2:
    max_visits: 1
    ask: [n_push2]
    branches:
      GIVES_PRICE: {goto: NF}
      PRICE_RANGE: {goto: NF}
      ANY: {goto: NF}

  NF:
    final: true
    branches:
      ANY:
        - {when: [price_known, price_le_max], say: [n_close], outcome: NEGOTIATED}
        - {say: [n_close], outcome: NEGOTIATION_FAILED}

  # ---------------- WhatsApp number (rule 5)
  W1:
    max_visits: 2
    ask: [w_ask]
    branches:
      GIVES_NUMBER: {goto: W2}
      SAME_NUMBER: {goto: W3}
      NO: {goto: W4}
      ASKS_REPEAT: {repeat: true, max_uses: 2}
      ANY: {goto: S7w}

  W2:
    max_visits: 2
    ask: [w_readback]
    branches:
      YES: {goto: W3}
      ACK: {goto: W3}
      NO: {goto: W1}
      ANY: {goto: W3}

  W3:
    final: true
    branches:
      ANY:
        - {when: [price_known], say: [w_done], outcome: QUOTE_COLLECTED}
        - {say: [w_done], outcome: WHATSAPP_REQUESTED}

  W4:   # no WhatsApp: they say it on the call (their words noted)
    max_visits: 1
    note: details
    ask: [w_none]
    branches:
      UNCLEAR: {goto: S7w}
      ANY: {goto: S7w}

  S7w:
    final: true
    branches:
      ANY:
        - {when: [price_known], say: [q_close], outcome: QUOTE_COLLECTED}
        - {say: [q_close], outcome: WHATSAPP_REQUESTED}

  # ---------------- a booking payment raised by the business (rule 6)
  P1:   # how much (their words noted)
    max_visits: 1
    note: advance_amount
    ask: [p_amount]
    branches:
      ASKS_REPEAT: {repeat: true, max_uses: 2}
      ANY: {goto: P2}

  P2:   # their UPI number, spoken; or WhatsApp for QR / bank details
    max_visits: 2
    ask: [p_upi_ask]
    branches:
      GIVES_NUMBER: {goto: P3}
      SAME_NUMBER: {goto: P5}
      WHATSAPP_PLEASE: {goto: PW1}
      NO: {goto: PW1}
      ASKS_REPEAT: {repeat: true, max_uses: 2}
      UNCLEAR: {goto: P5}
      ANY: {goto: P5}

  P3:   # UPI number read-back
    max_visits: 2
    ask: [w_readback]
    branches:
      YES: {goto: P5}
      ACK: {goto: P5}
      NO: {goto: P2}
      UNCLEAR: {goto: P5}
      ANY: {goto: P5}

  PW1:  # WhatsApp for the QR / bank details
    max_visits: 1
    ask: [p_wa_ask]
    branches:
      GIVES_NUMBER: {goto: PW2}
      SAME_NUMBER: {goto: PW3}
      YES: {goto: PW3}
      NO: {goto: PW4}
      ANY: {goto: PW3}

  PW2:
    max_visits: 1
    ask: [w_readback]
    branches:
      YES: {goto: PW3}
      ACK: {goto: PW3}
      NO: {goto: PW1}
      ANY: {goto: PW3}

  PW3:
    final: true
    branches:
      ANY: {say: [p_wa_done], outcome: PAYMENT_REQUESTED}

  PW4:  # no WhatsApp: the details are said on the call (their words noted)
    max_visits: 1
    note: payment_details
    ask: [p_here]
    branches:
      UNCLEAR: {goto: P5}
      ANY: {goto: P5}

  P5:
    final: true
    branches:
      ANY: {say: [p_close], outcome: PAYMENT_REQUESTED}

outcomes:
  QUOTE_COLLECTED:
    call_outcome: partial
    description: in stock and the price collected (price_inr, delivery, warranty, exchange notes), nothing ordered
    needs_quote: true
  OUT_OF_STOCK:
    call_outcome: declined
    description: not in stock (arrival note when they said it)
    collected: {out_of_stock: "yes"}
  HOLD_PENDING:
    call_outcome: pending_approval
    description: the hold could not be placed on this call (no delegation / check failed); the user decides
  BOOKED:
    call_outcome: success
    description: the shop was asked to hold the item for the user (after the user's approval)
    needs_quote: true
  NEGOTIATED:
    call_outcome: partial
    description: negotiation done, the shop's final price recorded (within the user's maximum)
    needs_quote: true
  NEGOTIATION_FAILED:
    call_outcome: partial
    description: the shop's final price is above the user's maximum; the user decides
    needs_quote: true
  PAYMENT_REQUESTED:
    call_outcome: partial
    description: the shop wants a booking payment; its UPI number or WhatsApp / bank details were taken for the user, who pays
  CALL_BACK_LATER:
    call_outcome: callback_later
    description: they asked us to call later
  WRONG_NUMBER:
    call_outcome: declined
    description: wrong number / not this kind of business
    collected: {wrong_number: "yes"}
  WHATSAPP_REQUESTED:
    call_outcome: partial
    description: they wanted to send details on WhatsApp instead of saying them
    collected: {whatsapp_requested: "yes"}
  PRICE_ON_REQUEST:
    call_outcome: partial
    description: no price on the phone / it depends
  UNCLEAR:
    call_outcome: partial
    description: could not understand them
  REFUSED:
    call_outcome: declined
    description: asked not to be called again, or hostile (no retry)
  NO_ANSWER:
    call_outcome: no_answer
    description: nobody picked up (set by the call runner)
