        task_types: [enquiry, hotel_booking]
        categories: [hotel, lodge, guest house, resort, homestay]
        keywords: [hotel, room, stay, check-in, night, resort]
      lines:
        s1_ask: "Main {user_first_name} {honorific} ki assistant hoon, unke room ke enquiry ke regarding call kiya hai. Kya abhi do minute baat ho sakti hai?"
        s2_ask: "{user_first_name} {honorific} ke liye {service} chahiye, {date_window}. Room available hai?"
        s3_ask: "Room ka ek raat ka rate kitna hai?"
        s3_readback_price: "Matlab {price_inr} rupaye ek raat ke. Sahi?"
        s3_readback_range_price: "Matlab {price_inr} rupaye tak ek raat ke. Sahi?"
        s4_ask: "Agar {stylist_pref} type ka room mil jaye to behtar hoga, warna koi bhi chalega?"
        s5_ask: "Koi advance ya cancellation policy hai?"

