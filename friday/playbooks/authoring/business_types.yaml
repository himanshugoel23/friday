      - "Good afternoon, Hotel Sunrise, how may I help you?"
      - "Hello, Hotel Grand, boliye."
      - "Reception, namaste."
    caller_questions:
      - "Kaun si date se kaun si date tak?"
      - "Kitne log honge, adults aur bachche?"
      - "Single, double ya family room?"
      - "AC ya non-AC? Breakfast chahiye?"
      - "Aapka naam aur number, taki main details bhej sakun?"
    quotes:
      price_units: "per night, rupaye; tax (12 percent GST) alag; breakfast kabhi included"
      typical_range: "Budget 1200 se 2500; mid-range 3000 se 6000; premium 8000+"
      not_on_phone: "Peak season / weekend ka rate: 'dates dekh ke'; corporate rate"
    wont_say_on_phone:
      - "Room number ya guest list"
      - "Discount, jab tak caller directly book na kare"
      - "Pakka hold bina advance ke"
    surprises:
      - {id: website_only, title: "Rate on website or WhatsApp", at: s3_ask, say: "WhatsApp pe bhej do number, rate wahi bhej dete hain", then: ["Room 3500 rupaye per night hai, tax alag"], expect: SLOT_OFFERED}
      - {id: advance_to_hold, title: "Hold needs an advance", at: s5_ask, say: "Haan 1000 rupaye advance dena padega, tabhi room rakhenge", expect: SLOT_OFFERED}
      - {id: manager_callback, title: "Manager will call back", at: s2_ask, say: "Manager abhi busy hain, thodi der baad call kijiye", expect: CALL_BACK_LATER}
      - {id: hold_check_rooms, title: "Holds to check availability", at: s2_ask, say: "Ek minute hold kijiye, system check karta hoon", hold_s: 25, then: ["Haan ji, kal ke liye room available hai, shaam 4 baje check-in"], expect: SLOT_OFFERED}
      - {id: peak_depends, title: "Rate depends on dates", at: s3_ask, say: "Dates ke hisaab se rate badalta hai, price depend karta hai", expect: SLOT_OFFERED}
    hangup_behaviour: "Polite in English: 'Thank you for calling, have a nice day', or Hindi 'Dhanyavaad'; chain hotels wait for the caller to hang up."
    language_mix: "English-heavy at chain hotels, Hinglish at small hotels; numbers in English."
    template:
      noun: hotel
      wrong_kind: travel agency
      service_default: room for 2
      business_default: hotel
      person_label: manager
      price_word: "Room"
      price_unit: "rupaye per night"
      price_inr: 3500
      duration_min: null
      slot_reply: "Haan kal ke liye room available hai, shaam 4 baje check-in"
      alt_reply: "Kal shaam 4 baje ya parso subah 11 baje se mil sakta hai"
      full_reply: "Kal to hotel full hai"
