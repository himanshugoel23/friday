# Knowledge about Indian business types, used by the SCRIPT-AUTHOR (friday playbook draft ...).
#
# This file is read only OFFLINE, while a new playbook is being drafted. It is never read during
# a call and never decides what Friday says on a call. Read it like a briefing note: "what does
# the person who picks up the phone at a <business type> usually say and do?"
#
# Each business type has:
#   title, task_type          what the playbook is called, which task type will use it
#   who_answers               who normally picks up
#   typical_opening           how the phone is answered (the first words Friday hears)
#   caller_questions          what THEY normally ask a caller (Friday must be ready for these)
#   quotes                    what they quote on the phone (units, usual ranges, "visit karke")
#   wont_say_on_phone         things they will not say on the phone
#   surprises                 awkward-but-common things: each becomes a simulated business
#                             ("persona") in the dry run. at = which Friday line it answers,
#                             say = what they say, then = what they say if Friday asks again,
#                             expect = the playbook outcome the call should still reach
#   hangup_behaviour          how they end a call
#   language_mix              how they speak
#   template                  hints for the OFFLINE template generator (no model needed)
#
# All Hinglish text is Roman script. Prices are rough, typical Indian-city (tier 1/2) numbers.

version: 1

business_types:

  clinic_appointment:
    title: Clinic / doctor appointment
    task_type: booking
    who_answers: "Receptionist or compounder at the front desk; in a small clinic the doctor's assistant or even the doctor's wife. Often fielding patients in person at the same time."
    typical_opening:
      - "Hello, Sharma Clinic, boliye."
      - "Hello, clinic."
      - "Ji, Dr Mehta ka clinic."
    caller_questions:
      - "Patient ka naam aur umar kya hai?"
      - "Pehle kabhi aaye hain? Koi purani file hai?"
      - "Kya problem hai, bukhar, pet dard, ya routine checkup?"
      - "Kaun sa time chahiye, subah ya shaam?"
      - "Aapka number kya hai, confirm karne ke liye?"
    quotes:
      price_units: "consultation fees per visit, rupaye"
      typical_range: "300 se 800 rupaye; specialist 600 se 1200"
      not_on_phone: "tests, injection, procedure ka kharcha: 'doctor dekhne ke baad batayenge'"
    wont_say_on_phone:
      - "Doctor ki personal availability ya chhutti ka karan"
      - "Kisi patient ki report ya diagnosis"
      - "Medicine ya treatment ka salah phone par"
    surprises:
      - {id: doctor_busy, title: "Doctor patient dekh rahe hain, baad mein call karo", at: s2_ask, say: "Doctor sahab abhi patient dekh rahe hain, thodi der baad call kijiye", expect: CALL_BACK_LATER}
      - {id: token_system, title: "Token system, no fixed appointment", at: s2_ask, say: "Token system hai, aap aa jaiye, number lag jayega", then: ["Shaam ko 5 baje tak aa jaiye"], expect: SLOT_OFFERED}
      - {id: whatsapp_fees, title: "Asks to take fees on WhatsApp", at: s3_ask, say: "WhatsApp pe bhej do", then: ["Consultation 500 rupaye hai, 15 minute"], expect: SLOT_OFFERED}
      - {id: booking_amount, title: "Wants a booking amount in advance", at: s5_ask, say: "Haan 200 rupaye booking amount dena padega", expect: SLOT_OFFERED}
      - {id: hold_for_doctor, title: "Puts Friday on hold to ask the doctor", at: s2_ask, say: "Ek minute hold kijiye, doctor se poochh kar batati hoon", hold_s: 25, then: ["Haan ji, kal shaam 6 baje ka slot hai"], expect: SLOT_OFFERED}
    hangup_behaviour: "Short 'Theek hai ji, dhanyavaad' and the line is cut, often before the caller finishes saying thanks."
    language_mix: "Hindi-English mix; medical words in English (appointment, fees, doctor, token); numbers often in English."
    template:
      noun: clinic
      wrong_kind: medical store
      service_default: doctor appointment
      business_default: clinic
      person_label: doctor
      price_word: "Consultation"
      price_inr: 500
      duration_min: 15
      slot_reply: "Haan kal shaam 6 baje ka slot free hai"
      alt_reply: "Kal subah 11 baje ya dopahar 2 baje ho jayega"
      full_reply: "Kal to doctor ka poora din full hai"
      select:
        task_types: [booking, healthcare]
        categories: [clinic, doctor, physician, general physician, gp, hospital]
        keywords: [clinic, doctor, consultation, checkup, physician]
      lines:
        s1_ask: "Main {user_first_name} {honorific} ki assistant hoon, unki doctor appointment ke regarding call kiya hai. Kya abhi do minute baat ho sakti hai?"
        s2_ask: "{user_first_name} {honorific} ke liye {service} chahiye, {date_window}. Slot milega?"
        s3_ask: "Doctor ki consultation fees kitni hai, aur kitna time lagega?"
        s4_ask: "Agar {stylist_pref} available hon to behtar hoga, warna koi bhi doctor chalega?"
        s5_ask: "Koi booking amount ya cancellation policy hai?"

  restaurant_table:
    title: Restaurant table booking
    task_type: booking
    who_answers: "Captain, host or cashier; at busy times the phone rings for long and the person is shouting over kitchen noise. Small places: the owner himself."
    typical_opening:
      - "Hello, Spice Garden, boliye."
      - "Namaste, restaurant."
      - "Haan ji, bataiye."
    caller_questions:
      - "Kitne log honge?"
      - "Kis time aayenge, aur kitni der ke liye?"
      - "Veg ya non-veg? Koi occasion hai, birthday?"
      - "Naam aur number bataiye."
      - "Ground floor chahiye ya upar?"
    quotes:
      price_units: "per head approx, rupaye; or 'minimum bill'"
      typical_range: "400 se 1200 rupaye per head; fine dining 2000+"
      not_on_phone: "Exact bill, kyunki menu aur order par depend karta hai; buffet ka rate weekend par alag"
    wont_say_on_phone:
      - "Peak time par table ka pakka wada (sirf 'aa jaiye, dekh lenge')"
      - "Kisi specific table ki guarantee"
    surprises:
      - {id: walk_in_only, title: "Only walk-in, no phone booking", at: s2_ask, say: "Booking nahi lete, walk-in hi hai, aap aa jaiye", then: ["Haan raat 8 baje table mil jayegi"], expect: SLOT_OFFERED}
      - {id: call_back_rush, title: "Rush hour, asks to call back", at: s2_ask, say: "Abhi bahut rush hai, thodi der baad call kijiye", expect: CALL_BACK_LATER}
      - {id: whatsapp_menu, title: "Says WhatsApp pe menu bhej do", at: s3_ask, say: "WhatsApp pe bhej do", then: ["Lagbhag 800 rupaye per head padega"], expect: SLOT_OFFERED}
      - {id: booking_amount, title: "Asks a booking amount for a big group", at: s5_ask, say: "Haan 500 rupaye booking amount lagega, adjust ho jayega", expect: SLOT_OFFERED}
      - {id: hold_ask_manager, title: "Holds while asking the manager", at: s2_ask, say: "Hold kijiye, manager se poochh kar batata hoon", hold_s: 30, then: ["Haan raat 8 baje ka slot hai"], expect: SLOT_OFFERED}
    hangup_behaviour: "Abrupt. 'Ok ji' and gone, or hands the phone to someone else mid-sentence."
    language_mix: "Heavy Hinglish; English for 'table', 'booking', 'veg', 'non-veg', 'buffet'; very fast speech."
    template:
      noun: restaurant
      wrong_kind: sweet shop
      service_default: table for 4
      business_default: restaurant
      person_label: captain
      price_word: "Lagbhag"
      price_unit: "rupaye per head"
      price_inr: 800
      duration_min: null
      slot_reply: "Haan kal raat 8 baje ka table free hai"
      alt_reply: "Kal raat 7 baje ya 9 baje ho jayega"
      full_reply: "Kal raat ko to full hai"
      select:
        task_types: [booking]
        categories: [restaurant, cafe, dhaba, dining, bar]
        keywords: [restaurant, table, dinner, lunch, cafe, dining]
      lines:
        s1_ask: "Main {user_first_name} {honorific} ki assistant hoon, unki table booking ke regarding call kiya hai. Kya abhi do minute baat ho sakti hai?"
        s2_ask: "{user_first_name} {honorific} ke liye {service} chahiye, {date_window}. Table milegi?"
        s3_ask: "Per head approx kitna padega?"
        s3_readback_price: "Matlab {price_inr} rupaye per head. Sahi?"
        s3_readback_range_price: "Matlab {price_inr} rupaye tak per head. Sahi?"
        s4_ask: "Agar {stylist_pref} wali jagah mil jaye to behtar hoga, warna koi bhi chalega?"
        s5_ask: "Koi booking amount ya cancellation policy hai?"

  car_service:
    title: Car service / repair garage
    task_type: booking
    who_answers: "Service advisor or the garage owner; mechanics shouting in the background. Authorised service centres have a front-desk executive who reads a script."
    typical_opening:
      - "Hello, Sai Motors, boliye."
      - "Haan ji, garage."
      - "Hello, service centre."
    caller_questions:
      - "Kaun si gaadi hai, model aur saal?"
      - "Petrol hai ya diesel?"
      - "Kitne kilometre chal chuki hai?"
      - "Kya dikkat hai, ya sirf routine service?"
      - "Gaadi kab la rahe hain, drop karenge ya wait?"
    quotes:
      price_units: "package rupaye (periodic service), parts alag"
      typical_range: "Hatchback basic service 2500 se 5000; SUV 4000 se 9000"
      not_on_phone: "Repair ka estimate: 'gaadi dekh ke hi bata payenge'; parts ka rate bina inspection ke nahi"
    wont_say_on_phone:
      - "Final bill bina gaadi dekhe"
      - "Kitne din lagenge, jab tak diagnosis na ho"
      - "Warranty claim ka faisla"
    surprises:
      - {id: visit_to_quote, title: "Price only after seeing the car", at: s3_ask, say: "Gaadi dekh ke visit karke batayenge, phone pe nahi bata sakte", expect: SLOT_OFFERED}
      - {id: price_depends, title: "Depends on the model and parts", at: s3_ask, say: "Price depend karta hai, parts lagenge to alag", expect: SLOT_OFFERED}
      - {id: parts_advance, title: "Wants an advance for parts", at: s5_ask, say: "Haan parts ke liye 1000 rupaye advance dena padega", expect: SLOT_OFFERED}
      - {id: callback_advisor, title: "Service advisor is busy", at: s2_ask, say: "Advisor abhi busy hai, thodi der baad call karo", expect: CALL_BACK_LATER}
      - {id: whatsapp_estimate, title: "Wants to send the estimate on WhatsApp", at: s3_ask, say: "WhatsApp pe bhej do", then: ["Basic service 3500 rupaye lagega"], expect: SLOT_OFFERED}
    hangup_behaviour: "Distracted; says 'haan ji' and the line goes dead, or passes the phone to a mechanic."
    language_mix: "Hindi with English nouns (service, clutch, brake pad, oil, AC); regional accent; loud background."
    template:
      noun: garage
      wrong_kind: tyre shop
      service_default: car service
      business_default: garage
      person_label: advisor
      price_word: "Basic service"
      price_inr: 3500
      duration_min: null
      slot_reply: "Haan kal subah 10 baje ka slot free hai"
      alt_reply: "Kal 10 baje ya dopahar 2 baje ho jayega"
      full_reply: "Kal to garage full hai"
      select:
        task_types: [booking]
        categories: [garage, car service, mechanic, workshop, service centre, car repair]
        keywords: [car service, garage, mechanic, oil change, car repair, servicing]
      lines:
        s1_ask: "Main {user_first_name} {honorific} ki assistant hoon, unki gaadi ki service ke regarding call kiya hai. Kya abhi do minute baat ho sakti hai?"
        s2_ask: "{user_first_name} {honorific} ki gaadi ke liye {service} chahiye, {date_window}. Slot milega?"
        s3_ask: "{service} ka approx kitna lagega?"
        s4_ask: "Agar {stylist_pref} dekh sakein to behtar hoga, warna koi bhi advisor chalega?"
        s5_ask: "Koi advance ya cancellation policy hai?"

  home_services:
    title: Plumber / electrician (home visit)
    task_type: booking
    who_answers: "The tradesperson himself, on a job with tools in hand, or a small dispatcher who calls the worker. Calls often cut and drop in basements and lifts."
    typical_opening:
      - "Haan ji, boliye."
      - "Hello, Raju plumber."
      - "Hello, bolo."
    caller_questions:
      - "Kya kharab hai, tap, pipe, switch, MCB?"
      - "Kaun se area mein hai, society ka naam?"
      - "Abhi aana hai ya kal?"
      - "Pehle photo bhej sakte ho WhatsApp par?"
      - "Address ka landmark bataiye."
    quotes:
      price_units: "visit charge (rupaye), kaam ka rate alag"
      typical_range: "Visit 200 se 500 rupaye; kaam ka estimate dekh ke"
      not_on_phone: "Total kaam ka rate: 'visit karke batayenge', kyunki problem dekhni padti hai"
    wont_say_on_phone:
      - "Pakka arrival time (traffic aur pichhli job par depend karta hai)"
      - "Material ka total kharcha bina dekhe"
    surprises:
      - {id: visit_charge_first, title: "Visit charge only, rest after inspection", at: s3_ask, say: "Visit karke batayenge, aane ka 300 rupaye lagega", expect: SLOT_OFFERED}
      - {id: whatsapp_photo, title: "Asks for a photo on WhatsApp", at: s2_ask, say: "WhatsApp pe photo bhej do pehle", then: ["Haan kal shaam 6 baje aa jaunga"], expect: SLOT_OFFERED}
      - {id: call_back_on_job, title: "On a job, will call back", at: s2_ask, say: "Abhi kaam pe hoon, baad mein call karo", expect: CALL_BACK_LATER}
      - {id: line_breaks, title: "Poor network, line breaks up", at: s2_ask, say: "kkh... hmm...", then: ["Haan kal shaam 6 baje aa jaunga"], expect: SLOT_OFFERED}
      - {id: advance_for_material, title: "Wants an advance for material", at: s5_ask, say: "Material ke liye 500 rupaye advance dena padega", expect: SLOT_OFFERED}
    hangup_behaviour: "Says 'theek hai bhaiya' or just 'haan haan' and cuts; sometimes calls back within a minute from the same number."
    language_mix: "Colloquial Hindi, little English; local words for parts; numbers in Hindi ('paanch sau')."
    template:
      noun: service provider
      wrong_kind: grocery shop
      service_default: plumber visit
      business_default: plumber
      person_label: mistri
      price_word: "Visit charge"
      price_inr: 300
      duration_min: 45
      slot_reply: "Haan kal shaam 6 baje aa jaunga"
      alt_reply: "Kal subah 11 baje ya dopahar 3 baje aa sakta hoon"
      full_reply: "Kal to poora din full hai"
      select:
        task_types: [booking, service_coordination]
        categories: [plumber, electrician, home service, handyman, carpenter, ac repair]
        keywords: [plumber, electrician, tap, leak, mcb, fan repair, ac repair, handyman]
      lines:
        s1_ask: "Main {user_first_name} {honorific} ki assistant hoon, unke ghar ke kaam ke regarding call kiya hai. Kya abhi do minute baat ho sakti hai?"
        s2_ask: "{user_first_name} {honorific} ke ghar par {service} chahiye, {date_window}. Aa sakenge?"
        s3_ask: "Visit charge kitna hai, aur kaam mein kitna time lagega?"
        s4_ask: "Agar {stylist_pref} aa sakein to behtar hoga, warna koi bhi chalega?"
        s5_ask: "Koi advance ya material ka alag charge hai?"

  hotel_enquiry:
    title: Hotel room enquiry
    task_type: enquiry
