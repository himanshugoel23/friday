  dentist_appointment:
    title: Dentist appointment
    task_type: booking
    who_answers: "Dental assistant or receptionist; the dentist is chairside and rarely comes to the phone. Chains read a script, single-doctor clinics improvise."
    typical_opening:
      - "Hello, Smile Dental Clinic, boliye."
      - "Hello, dental clinic."
      - "Haan ji, doctor ka clinic."
    caller_questions:
      - "Kya problem hai, dard, cavity, cleaning, braces?"
      - "Pehle kabhi aaye hain, koi purani file?"
      - "Dard abhi hai ya sirf checkup chahiye?"
      - "Kaun sa time theek rahega, shaam ko zyada bheed hoti hai."
      - "Naam aur number batao, reminder bhej denge."
    quotes:
      price_units: "consultation fees rupaye; treatment ka alag"
      typical_range: "Consultation 300 se 700; cleaning 800 se 2000; root canal 3000 se 8000; filling 800 se 1500"
      not_on_phone: "Treatment ka total: 'pehle dekhna padega, X-ray ke baad batayenge'"
    wont_say_on_phone:
      - "Treatment ka final kharcha bina dekhe"
      - "Dard ki dawai ya antibiotics phone par"
      - "Doctor ka personal number"
    surprises:
      - {id: doctor_in_surgery, title: "Doctor is with a patient", at: s2_ask, say: "Doctor sahab abhi patient dekh rahe hain, baad mein call kijiye", expect: CALL_BACK_LATER}
      - {id: treatment_after_xray, title: "Price only after the X-ray", at: s3_ask, say: "Pehle dekhna padega, visit karke batayenge, phone pe nahi bata sakte", expect: SLOT_OFFERED}
