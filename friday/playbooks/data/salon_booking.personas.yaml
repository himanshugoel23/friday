    greeting: "Hello, Looks Salon."
    brief: {delegation_max_price: 800, date_window: aaj shaam 5 baje}
    replies:
      s3_ask: "Haircut 400 rupaye"
      s2_ask: "Haan aaj shaam 5 baje free hai"
    expect: {outcome: BOOKED}

  - id: book_busy_fallback_accepted
    title: "Today is busy, tomorrow at the same time is free: books the fallback"
    greeting: "Hello, Looks Salon."
    brief: {delegation_max_price: 800, date_window: aaj shaam 5 baje, fallback_when: kal shaam 5 baje}
    replies:
