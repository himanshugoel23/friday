      s2_ask: "Haan ho jayega, pehle 200 rupaye advance bhejna padega"
    expect: {outcome: SLOT_OFFERED}

  - id: book_yes_without_time
    title: "No time named; she says yes without one, so Friday asks which time"
    greeting: "Hello, Looks Salon."
    brief: {delegation_max_price: 800, mode: book}
    replies:
      s3_ask: "Haircut 350 rupaye"
      s2_ask: "Haan ho jayega"
