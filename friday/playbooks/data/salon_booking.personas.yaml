# Simulated salons for `friday playbook dry-run salon_booking`.
#
# Each persona answers what Friday just said. Replies are keyed by the PLAYBOOK LINE ID Friday
# last spoke (so a persona keeps working when the wording changes). Useful keys:
#   disclosure   the identity question ("Hello, kya meri baat X se ho rahi hai?"); also s0_who
#   s3_ask       the price question (first time and asked again)
#   s2_ask       book mode: "Kya <time> ka slot mil sakta hai?"
#   s2f_ask      book mode: the fallback day ("Achha, nahi ho sakta. Toh kya kal ka slot...")
#   s2b_ask / s2b_ask_two / s2_ask_time / s3b_ask / s4_ask   the smaller questions
# `<line>@<previous line>` answers "Sorry, ek baar phir?". A list is used in order (the last
# item repeats). A reply may be a dict: {say, hold_s, then, hangup, silence}.
# The identity question is answered "Haan ji, boliye" unless the persona lists a reply for it.
# `brief:` keys: user_first_name, honorific, services ("haircut, beard trim"), business_name,
# business_name_spoken, date_window, fallback_when, budget, stylist_pref, mode (quote_only|book),
# delegation_max_price (the owner delegated the booking: book mode needs it; without it the
# call is a price check whatever `mode` says), negotiation, explore_options.
# `expect.outcome` is the playbook outcome this persona should lead to (checked by the dry run).
# AI questions: wherever a persona asks "AI ho?" / "robot hai?" / "insaan ho?" the dry run checks
# that Friday's very next line says AI (hard safety rule, ai_disclosure: on_request).

version: 1
playbook: salon_booking

brief:               # the simulated task (what the user asked for)
  user_first_name: Rahul
  honorific: sir
  services: haircut
  date_window: kal shaam
  budget: 600

personas:
  - id: quote_friendly
    title: "Price check: friendly salon quotes a fair price"
    greeting: "Hello, Looks Salon."
    replies:
      s3_ask: "Haircut 400 rupaye lagega, lagbhag 30 minute"
    expect: {outcome: QUOTE_COLLECTED}

  - id: quote_one_service
    title: "One service, plain"
    greeting: "Hello, Looks Salon."
    brief: {services: haircut}
    replies:
      s3_ask: "400 rupaye"
    expect: {outcome: QUOTE_COLLECTED}

  - id: quote_two_services
    title: "Two services: haircut aur beard trim"
    greeting: "Hello, Looks Salon."
    brief: {services: "haircut, beard trim"}
    replies:
      s3_ask: "Dono ke 550 rupaye lagenge"
    expect: {outcome: QUOTE_COLLECTED}

  - id: quote_three_services
    title: "Three services joined naturally"
    greeting: "Hello, Looks Salon."
    brief: {services: "haircut, beard trim and facial"}
    replies:
      s3_ask: "Teeno ke 900 rupaye lagenge"
    expect: {outcome: QUOTE_COLLECTED}

  - id: quote_ampersand_name
    title: "Business name with an ampersand and a Devanagari spoken form"
    greeting: "Hello, Looks Salon."
    brief: {business_name: "Ravi & Sons Hair Studio", business_name_spoken: "रवि aur सन्स hair studio"}
    replies:
      s3_ask: "Haircut 450 rupaye"
    expect: {outcome: QUOTE_COLLECTED}

  - id: quote_devanagari_names
