    replies:
      disclosure: "Aap AI ho?"
      s3_ask: "Haircut 400 rupaye"
    expect: {outcome: QUOTE_COLLECTED}

  - id: ai_insaan_at_price
    title: "Asks insaan ho ya machine? at the price question"
    greeting: "Hello, Looks Salon."
    replies:
      s3_ask: ["Aap insaan ho ya machine?", "Haircut 400 rupaye"]
    expect: {outcome: QUOTE_COLLECTED}

  - id: ai_real_person_english
    title: "Asks Am I talking to a real person?"
    greeting: "Hello, Looks Salon."
    replies:
      s3_ask: ["Am I talking to a real person?", "Haircut 400 rupaye"]
    expect: {outcome: QUOTE_COLLECTED}

  - id: ai_bot_english
    title: "Asks Is this a bot?"
    greeting: "Hello, Looks Salon."
    replies:
      s3_ask: ["Is this a bot?", "Haircut 400 rupaye"]
