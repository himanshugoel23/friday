    greeting: "Hello?"
    replies:
      disclosure: "Nahi, yeh Meena parlour hai"
    expect: {outcome: WRONG_NUMBER}

  - id: quote_wrong_number_later
    title: "Not a salon (said after the intro)"
    greeting: "Hello, Looks Salon."
    replies:
      s3_ask: "Yeh salon nahi hai, aapne galat number lagaya hai"
