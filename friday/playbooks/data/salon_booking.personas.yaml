  - id: ai_asked_twice
    title: "Asks twice at the price question; both answers say AI"
    greeting: "Hello, Looks Salon."
    replies:
      s3_ask: ["Robot hai kya?", "Pakka AI hai na?", "Haircut 400 rupaye"]
    expect: {outcome: QUOTE_COLLECTED}

  - id: ai_asked_at_slot_step
    title: "Book mode: asks robot hai? at the slot question"
    greeting: "Hello, Looks Salon."
    brief: {delegation_max_price: 800, date_window: aaj shaam 5 baje}
    replies:
      s3_ask: "Haircut 400 rupaye"
      s2_ask: ["Yeh robot hai kya?", "Haan ho jayega"]
    expect: {outcome: BOOKED}

  - id: ai_asked_at_fallback_step
    title: "Book mode: asks AI hai? at the fallback-day question"
    greeting: "Hello, Looks Salon."
    brief: {delegation_max_price: 800, date_window: aaj shaam 5 baje, fallback_when: kal shaam 5 baje}
    replies:
      s3_ask: "Haircut 400 rupaye"
      s2_ask: "Aaj to full hai"
      s2f_ask: ["Aap AI ho kya?", "Haan kal ho jayega"]
    expect: {outcome: BOOKED}

  - id: ai_asked_then_hangs_up
    title: "Asks if she is a robot and puts the phone down"
    greeting: "Hello, Looks Salon."
    replies:
      s3_ask: {say: "Arre yeh robot hai, bye", hangup: true}
    expect: {call_outcome: hung_up}

  - id: book_free_today
    title: "The time is free and the price fits: books that time"
    greeting: "Hello, Looks Salon."
    brief: {delegation_max_price: 800, date_window: aaj shaam 5 baje}
    replies:
      s3_ask: "Haircut 400 rupaye"
      s2_ask: "Haan ho jayega"
    expect: {outcome: BOOKED}

  - id: book_free_names_time
