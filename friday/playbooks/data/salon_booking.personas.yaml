    greeting: "Hello, Looks Salon."
    brief: {business_name: "Shreya Salon", business_name_spoken: "श्रेया saloon", user_first_name: Himanshu, user_spoken: "हिमांशु"}
    replies:
      s3_ask: "Haircut 350 rupaye"
    expect: {outcome: QUOTE_COLLECTED}

  - id: quote_madam_honorific
    title: "The honorific is an input (madam)"
    greeting: "Hello, Looks Salon."
    brief: {honorific: madam}
    replies:
      s3_ask: "Haircut 500 rupaye"
    expect: {outcome: QUOTE_COLLECTED}

  - id: quote_price_range
    title: "A price range: the upper number is taken"
    greeting: "Hello, Looks Salon."
    replies:
      s3_ask: "Haircut 400 se 500 rupaye tak lagega"
    expect: {outcome: QUOTE_COLLECTED}

  - id: quote_volunteers_duration
    title: "The salon volunteers the duration; Friday does not repeat it"
    greeting: "Hello, Looks Salon."
    replies:
      s3_ask: "Haircut 400 rupaye, lagbhag 40 minute lagte hain"
    expect: {outcome: QUOTE_COLLECTED}

  - id: quote_over_budget_never_haggles
    title: "Price above the budget; a price check never negotiates"
    greeting: "Hello, Looks Salon."
    brief: {negotiation: true}
    replies:
      s3_ask: "Haircut 900 rupaye lagega"
      s3b_ask: "Theek hai, 700 kar dete hain"
    expect: {outcome: QUOTE_COLLECTED}

  - id: quote_price_depends
    title: "Price depends on the stylist: nothing to report, so UNCLEAR"
    greeting: "Hello, Looks Salon."
    replies:
      s3_ask: "Stylist ke hisaab se alag alag hota hai"
    expect: {outcome: UNCLEAR}

  - id: quote_refuses_price
    title: "Will not give a price on the phone"
    greeting: "Hello, Looks Salon."
    replies:
      s3_ask: "Phone par price nahi bata sakte, aake poochh lijiye"
    expect: {outcome: UNCLEAR}

  - id: quote_salon_raises_advance
    title: "The salon asks for an advance with the price; she does not agree"
    greeting: "Hello, Looks Salon."
    replies:
      s3_ask: "Haircut 400 rupaye, 200 rupaye advance dena padega"
    expect: {outcome: UNCLEAR}

  - id: quote_cancellation_fee
    title: "The salon mentions a cancellation fee"
    greeting: "Hello, Looks Salon."
    replies:
      s3_ask: "Haircut 400 rupaye, cancel karoge to cancellation charge lagega"
    expect: {outcome: UNCLEAR}

  - id: quote_no_advance_said
    title: "The salon volunteers that no advance is needed"
    greeting: "Hello, Looks Salon."
    replies:
      s3_ask: "Haircut 400 rupaye, koi advance nahi"
