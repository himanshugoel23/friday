# Plan templates = base archetype + per-category overrides (docs/PROJECT_MANAGER.md).
# The PM merges: archetype base -> categories.<cat>["*"] -> categories.<cat>[<archetype>].
# Nothing here is spoken to a vendor: questions are WhatsApp text for the USER.

step_order: [locate, search, filter, reviews, rank, shortlist, consent, calls, collect, compare, report]

# Slots the PM can ask about. kind tells the answer parser how to read a free-text reply.
slots:
  where:
    kind: text
    en: "Which area or locality should I look in? (for example Sector 45 Gurgaon)"
    hinglish: "Kis area ya locality mein dekhun? (jaise Sector 45 Gurgaon)"
  service:
    kind: text
    en: "What exactly do you need?"
    hinglish: "Aapko exactly kya chahiye?"
  when:
    kind: text
    en: "When would you like it? (for example today evening, or tomorrow 5 pm)"
    hinglish: "Kab chahiye? (jaise aaj shaam, ya kal 5 baje)"
  budget:
    kind: money
    en: "Do you have a maximum budget in rupees?"
    hinglish: "Kya aapka koi maximum budget hai (rupees mein)?"
  for_whom:
    kind: text
    en: "Is this for you or someone else?"
    hinglish: "Yeh aapke liye hai ya kisi aur ke liye?"
  delegation:
    kind: yesno
    en: "Should I book it for you directly if I find a good match, or only share prices and availability first?"
    hinglish: "Achha option mile toh kya main seedha book kar doon, ya pehle sirf price aur availability bataun?"
  details:
    kind: text
    en: "Any detail that matters for this? (size, model, number of people)"
    hinglish: "Koi zaroori detail? (size, model, kitne log)"

  # ---- facts the PM collects BEFORE calling (names = friday/vendors/facts.py). fact: true means
  # the question does not use up the PM's question rounds. only_if: asked only when that gate
  # slot is true. Gates (at_venue, exchange) are asked once and are not themselves facts.
  at_venue:
    kind: venue_choice
    fact: true
    en: "Will you go to the parlour, or should the makeup artist come to the venue?"
    hinglish: "Parlour jaoge ya makeup wali venue par aayegi?"
  exchange:
    kind: yesno
    fact: true
    en: "Do you want to exchange an old phone?"
    hinglish: "Exchange karna hai?"
  old_phone_model:
    {kind: text, fact: true, only_if: exchange, en: "Which old phone is it (company and model)?", hinglish: "Purana phone kaunsa hai (company aur model)?"}
  old_phone_year:
    {kind: text, fact: true, only_if: exchange, en: "Which year did you buy it?", hinglish: "Kis saal liya tha?"}
  old_phone_condition:
    {kind: text, fact: true, only_if: exchange, en: "Is it working fully, any damage?", hinglish: "Poori tarah chal raha hai, koi damage?"}
  event_type:
    {kind: text, fact: true, en: "What is the event? (shaadi, birthday, corporate ...)", hinglish: "Event kaunsa hai? (shaadi, birthday, corporate ...)"}
  event_date:
    {kind: text, fact: true, en: "What is the event date?", hinglish: "Event ki date kya hai?"}
  event_venue:
    {kind: text, fact: true, en: "What is the venue name?", hinglish: "Venue ka naam kya hai?"}
  event_city:
    {kind: text, fact: true, en: "Which city or area is the venue in?", hinglish: "Venue kis city ya area mein hai?"}
  guests:
    {kind: text, fact: true, en: "How many guests?", hinglish: "Kitne mehmaan honge?"}
  people_count:
    {kind: text, fact: true, en: "For how many people?", hinglish: "Kitne log honge?"}
  veg_nonveg:
    {kind: text, fact: true, en: "Veg or non-veg?", hinglish: "Veg ya non-veg?"}
  rooms_needed:
    {kind: text, fact: true, en: "Do you need rooms for the guests? How many? (say skip if not)", hinglish: "Mehmaanon ke liye rooms chahiye? Kitne? (nahi chahiye toh skip bol dein)"}
  extras_needed:
    {kind: text, fact: true, en: "Decoration, DJ or sound needed? (say skip if not)", hinglish: "Decoration, DJ ya sound chahiye? (nahi chahiye toh skip bol dein)"}
  items_description:
    {kind: text, fact: true, en: "What needs to be moved? (for example 2 BHK household items, 1 bike)", hinglish: "Kya saaman shift karna hai? (jaise 2 BHK ka saaman, 1 bike)"}
  from_place:
    {kind: text, fact: true, en: "Pickup place?", hinglish: "Kahan se uthana hai?"}
  to_place:
    {kind: text, fact: true, en: "Drop place?", hinglish: "Kahan chhodna hai?"}
  floor_info:
    {kind: text, fact: true, en: "Which floor, and is there a lift, at both ends?", hinglish: "Dono jagah kaunsi floor hai aur lift hai ya nahi?"}
  date:
    {kind: text, fact: true, en: "On which date?", hinglish: "Kis date ko?"}
  time:
    {kind: text, fact: true, en: "At what time?", hinglish: "Kitne baje?"}
  sharing_type:
    {kind: text, fact: true, en: "Single, double or triple sharing?", hinglish: "Single, double ya triple sharing?"}
  move_in_date:
    {kind: text, fact: true, en: "When do you want to move in?", hinglish: "Kab shift hona hai?"}
  occupant_name:
    {kind: text, fact: true, en: "Who is the room for? (name)", hinglish: "Room kiske liye hai? (naam)"}
  occupant_from:
    {kind: text, fact: true, en: "Where do they come from?", hinglish: "Wo kahan se aa rahe hain?"}
  occupant_job:
    {kind: text, fact: true, en: "Where do they work or study?", hinglish: "Wo kahan kaam ya padhai karte hain?"}
  occupant_location:
    {kind: text, fact: true, en: "Where do they live now?", hinglish: "Abhi kahan rehte hain?"}
  pickup_time:
    {kind: text, fact: true, en: "Pickup date and time?", hinglish: "Pickup kis date ko aur kitne baje?"}
  trip_type:
    {kind: text, fact: true, en: "One way or round trip?", hinglish: "One way ya round trip?"}
  luggage:
    {kind: text, fact: true, en: "How many bags or how much luggage?", hinglish: "Kitne bag ya kitna saaman hoga?"}
  delivery_area:
    {kind: text, fact: true, en: "Which area is the delivery to?", hinglish: "Delivery kis area mein karni hai?"}
  checkin_date:
    {kind: text, fact: true, en: "Check-in date?", hinglish: "Check-in kis date ko?"}
  checkout_date:
    {kind: text, fact: true, en: "Check-out date?", hinglish: "Check-out kis date ko?"}
  room_count:
    {kind: text, fact: true, en: "How many rooms?", hinglish: "Kitne room chahiye?"}
  room_type:
    {kind: text, fact: true, en: "Any room type? (deluxe, suite ... say skip if not)", hinglish: "Koi room type? (deluxe, suite ... nahi toh skip bol dein)"}

# Order in which missing required slots are asked (one per round).
ask_order: [at_venue, service, where, exchange, old_phone_model, old_phone_year, old_phone_condition, event_type, items_description, from_place, to_place, floor_info, sharing_type, date, event_date, checkin_date, checkout_date, move_in_date, pickup_time, time, occupant_name, occupant_from, occupant_job, occupant_location, event_venue, event_city, delivery_area, guests, people_count, room_count, room_type, veg_nonveg, rooms_needed, extras_needed, luggage, trip_type, when, details, budget, for_whom, delegation]

messages:
  category_unclear:
    en: "I want to get this right. What kind of place or service are you looking for? (for example salon, doctor, AC repair, packers)"
    hinglish: "Main sahi se samajhna chahti hoon. Aap kis tarah ki service ya jagah dhoondh rahe hain? (jaise salon, doctor, AC repair, packers)"
  bucket_unclear:
    en: "Do you want prices, availability or a booking?"
    hinglish: "Aapko price chahiye, availability, ya booking?"
  # Founder rule: ONE acknowledgement when the request is understood, then silence until an
  # outcome or a question only the user can answer. "progress" is sent only if updates are ON.
  ack:
    en: "Got it: {summary}. I will get back to you with the result."
    hinglish: "Samajh gayi: {summary}. Result aate hi bata dungi."
  ack_assumed:
    en: "Got it: {summary}. I am assuming {assumed}. I will get back to you with the result."
    hinglish: "Samajh gayi: {summary}. Main yeh maan rahi hoon: {assumed}. Result aate hi bata dungi."
  progress:
    en: "Update: {step} done."
    hinglish: "Update: {step} ho gaya."
  stop_missing:
    en: "I could not get enough details ({missing}) to search properly. Message me again with them and I will start right away."
    hinglish: "Mujhe poori detail ({missing}) nahi mili, isliye search nahi kar paayi. Woh bata dein toh main turant shuru kar dungi."
  stop_category:
    en: "Sorry, I could not work out what you need. Tell me the service and area and I will start."
    hinglish: "Maaf kijiye, main samajh nahi paayi aapko kya chahiye. Service aur area bata dein toh main shuru kar dungi."
  handoff:
    en: "This one needs a person to look at it. I have noted it and someone from the team will get back to you."
    hinglish: "Yeh request hamari team ko dekhni padegi. Maine note kar li hai, team aapko jald batayegi."
  widen:
    en: "I could not find a good option within {current_km} km. Shall I look up to {to_km} km?"
    hinglish: "{current_km} km ke andar koi achha option nahi mila. Kya main {to_km} km tak dekhun?"
  widen_stop:
    en: "I found nothing good within {hard_max_km} km, which is as far as I will go for this. Try a different area or service and I will search again."
    hinglish: "{hard_max_km} km tak koi achha option nahi mila, aur isse door main nahi dekhti. Doosra area ya service bata dein, main dobara dhoondhungi."
  widen_declined:
    en: "Okay, I will leave it here. Message me if you want me to try again."
    hinglish: "Theek hai, yahin rok deti hoon. Dobara try karna ho toh bata dijiye."
  consent:
    en: "Shortlist ({count}):\n{list}\nShall I call these for you? If one does not answer I will try the next best one nearby. (yes / no)"
    hinglish: "Shortlist ({count}):\n{list}\nKya main inhe call karun? Koi phone na uthaye toh paas ka agla achha option try karungi. (haan / nahi)"
  consent_declined:
    en: "Okay, no calls will be made."
    hinglish: "Theek hai, kisi ko call nahi karungi."
  yesno_unclear:
    en: "Sorry, was that a yes or a no?"
    hinglish: "Maaf kijiye, yeh haan tha ya nahi?"
  all_no_pickup:
    en: "None of the places picked up. Message me later and I will try again."
    hinglish: "Kisi ne phone nahi uthaya. Thodi der baad bata dijiye, main dobara try karungi."
  over_budget:
    en: "All the quotes are above your Rs {budget} budget (lowest Rs {lowest}). Shall I still show them? (yes / no)"
    hinglish: "Saare quotes aapke Rs {budget} budget se upar hain (sabse kam Rs {lowest}). Phir bhi dikhaun? (haan / nahi)"
  over_budget_declined:
    en: "Okay. Tell me a new budget if you want me to look again."
    hinglish: "Theek hai. Naya budget bata dein toh main dobara dekhungi."
  cancelled:
    en: "Done, I have cancelled this request."
    hinglish: "Theek hai, maine yeh request cancel kar di."
  replanned:
    en: "Updated: {changes}. Redoing the affected steps."
    hinglish: "Update kar diya: {changes}. Jo steps affect hue hain woh dobara kar rahi hoon."
  step_failed:
    en: "Something went wrong on my side while working on this. I have saved it and will retry shortly."
    hinglish: "Mere side se kuch gadbad ho gayi. Maine yeh save kar liya hai, jaldi dobara try karungi."
  switched_to_check:
    en: "Understood, I will only check prices and availability and not book."
    hinglish: "Theek hai, main sirf price aur availability check karungi, booking nahi."
  blocked:
    en: "I am not able to make these calls right now. I have noted it and will tell you when I can."
    hinglish: "Abhi main yeh calls nahi kar sakti. Maine note kar liya hai, jab ho payega bata dungi."
  terminal:
    en: "This request is already closed. Send a new message to start another."
    hinglish: "Yeh request band ho chuki hai. Nayi request ke liye naya message bhejiye."

archetypes:
  quote:
    steps: [locate, search, filter, reviews, rank, shortlist, consent, calls, collect, compare, report]
    required: [service, where]
    optional: [when, budget, for_whom]
    defaults: {for_whom: self, when: any day}
    n_vendors: 3
    call_mode: all            # call until n_vendors answered
  availability:
    steps: [locate, search, filter, reviews, rank, shortlist, consent, calls, collect, compare, report]
    required: [service, where, when]
    optional: [budget, for_whom]
    defaults: {for_whom: self}
    n_vendors: 3
    call_mode: all
  book:
    steps: [locate, search, filter, reviews, rank, shortlist, consent, calls, collect, report]
    required: [service, where, when, delegation]
    optional: [budget, for_whom]
    defaults: {for_whom: self}
    n_vendors: 1
    call_mode: first_success  # book at the first vendor that works, else next vendor
  service_visit:
    steps: [locate, search, filter, reviews, rank, shortlist, consent, calls, collect, compare, report]
    required: [service, where, when]
    optional: [budget, details]
    defaults: {when: as soon as possible, for_whom: self}
    n_vendors: 3
    call_mode: all
  information:
    steps: [locate, search, filter, rank, shortlist, consent, calls, collect, report]
    required: [service, where]
    optional: [for_whom]
    defaults: {for_whom: self}
    n_vendors: 1
    call_mode: first_success
  handoff:
    steps: []
    required: []
    optional: []
    defaults: {}
    n_vendors: 0
    call_mode: none

# Per-category overrides. "*" applies to every archetype of that category.
# required_add / required_remove edit the archetype's required list; questions override slot wording.
categories:
  salon:
    "*": {required_add: [at_venue, event_type, event_date, event_venue, event_city, people_count], only_if: {event_type: at_venue, event_date: at_venue, event_venue: at_venue, event_city: at_venue, people_count: at_venue}, questions: {service: {en: "Which service do you want? (for example haircut, beard trim, facial)", hinglish: "Kaunsi service chahiye? (jaise haircut, beard trim, facial)"}}}
  clinic:
    "*": {questions: {service: {en: "Which kind of doctor, or what is the problem? (for example dentist, skin, general)", hinglish: "Kaunsa doctor chahiye ya kya takleef hai? (jaise dentist, skin, general)"}}}
    book: {required_add: [for_whom]}
    availability: {required_add: [for_whom]}
  diagnostic_lab:
    "*": {questions: {service: {en: "Which test or package?", hinglish: "Kaunsa test ya package?"}}}
    service_visit: {defaults: {when: tomorrow morning}}
  appliance_repair:
    "*": {questions: {service: {en: "Which appliance and what is wrong with it?", hinglish: "Kaunsa appliance aur kya kharabi hai?"}}}
    service_visit: {defaults: {when: today}}
  home_repair:
    "*": {questions: {service: {en: "What work is needed? (plumber, electrician, carpenter, painter)", hinglish: "Kya kaam karwana hai? (plumber, electrician, carpenter, painter)"}}}
    service_visit: {defaults: {when: today}}
  packers_movers:
    "*": {required_remove: [when, details], required_add: [items_description, from_place, to_place, floor_info, date], skippable_add: [budget], questions: {where: {en: "Where are you moving from (area/city)?", hinglish: "Kahan se shift kar rahe hain (area/city)?"}}}
  pest_control:
    "*": {required_add: [details], questions: {details: {en: "How big is the place (BHK) and which pest?", hinglish: "Jagah kitni badi hai (BHK) aur kaunsa keeda?"}}}
    service_visit: {defaults: {when: tomorrow}}
  car_service:
    "*": {required_add: [details], questions: {details: {en: "Which car (make and model)?", hinglish: "Kaunsi gaadi hai (company aur model)?"}}}
  restaurant_table:
    "*": {required_remove: [when, details], required_add: [date, time, people_count]}
  hotel_stay:
    "*": {required_remove: [when, details], required_add: [checkin_date, checkout_date, guests, room_count], skippable_add: [room_type, budget]}
  banquet_hall:
    "*": {required_remove: [when, details], required_add: [event_type, event_date, guests, veg_nonveg], skippable_add: [rooms_needed, extras_needed]}
  coaching_classes:
    "*": {questions: {service: {en: "Which class or subject, and for which grade/age?", hinglish: "Kaunsi class ya subject, aur kis grade/age ke liye?"}}}
  pg_rental:
    "*": {required_add: [sharing_type, move_in_date, occupant_name, occupant_from, occupant_job, occupant_location], skippable_add: [budget], questions: {service: {en: "PG or flat, and for boys, girls or family?", hinglish: "PG ya flat, aur ladko, ladkiyon ya family ke liye?"}}}
  electronics_dealer:
    "*": {required_add: [exchange, old_phone_model, old_phone_year, old_phone_condition], questions: {service: {en: "Which product and model?", hinglish: "Kaunsa product aur model?"}}}
  gym_yoga:
    "*": {questions: {service: {en: "Gym, yoga or something else?", hinglish: "Gym, yoga ya kuch aur?"}}}
  event_services:
    "*": {required_remove: [when, details], required_add: [event_type, event_date, event_venue, event_city, guests]}
  vet_pet:
    "*": {required_add: [details], questions: {details: {en: "Which pet (dog, cat) and what age?", hinglish: "Kaunsa pet hai (dog, cat) aur kitni age?"}}}
  wedding_vendors:
    "*": {required_remove: [when, details], required_add: [event_type, event_date, event_venue, event_city, guests]}
  driving_school:
    "*": {}
  cab_travel:
    "*": {required_remove: [when, details, where], required_add: [from_place, to_place, pickup_time, people_count, luggage, trip_type], radius_km: 20}
  laundry_tailor:
    "*": {}
  florist_gift:
    "*": {required_remove: [when], required_add: [delivery_area, date]}
    availability: {required_add: []}
    quote: {optional_add: [when]}

# Phone-call wording (channel "call"): ONE very short, speakable question; no lists, no symbols.
# Long inputs (long_slots) are never asked on a call: they are requested on WhatsApp afterwards,
# and the final outcome is always delivered on WhatsApp.
long_slots: [details]
spoken:
  slots:
    where: {en: "Which area?", hinglish: "Kaunse area mein?"}
    service: {en: "What do you need?", hinglish: "Kya chahiye aapko?"}
    when: {en: "When do you need it?", hinglish: "Kab chahiye?"}
    budget: {en: "What is your budget?", hinglish: "Budget kitna hai?"}
    for_whom: {en: "Is it for you?", hinglish: "Aapke liye hai?"}
    delegation: {en: "Should I book it for you?", hinglish: "Kya main book kar doon?"}
    details: {en: "Any other detail?", hinglish: "Aur koi detail?"}
  messages:
    category_unclear: {en: "Sorry, what service do you need?", hinglish: "Maaf kijiye, kaunsi service chahiye?"}
    bucket_unclear: {en: "Price, availability or booking?", hinglish: "Price, availability, ya booking?"}
    ack: {en: "Got it. I will message you the result on WhatsApp.", hinglish: "Samajh gayi. Result aapko WhatsApp par bhej dungi."}
    ack_assumed: {en: "Got it. I will message you the result on WhatsApp.", hinglish: "Samajh gayi. Result aapko WhatsApp par bhej dungi."}
    whatsapp_followup: {en: "I need a few more details. I will ask you on WhatsApp.", hinglish: "Kuch details chahiye, woh main WhatsApp par poochungi."}
    yesno_unclear: {en: "Sorry, yes or no?", hinglish: "Maaf kijiye, haan ya nahi?"}
    cancelled: {en: "Okay, cancelled.", hinglish: "Theek hai, cancel kar diya."}
    replanned: {en: "Okay, changed.", hinglish: "Theek hai, badal diya."}
    stop_missing: {en: "I could not get the details. I will message you on WhatsApp.", hinglish: "Details nahi mil paayi. Main WhatsApp par message karungi."}
    stop_category: {en: "Sorry, I did not understand. Please message me on WhatsApp.", hinglish: "Maaf kijiye, samajh nahi aaya. Please WhatsApp par likh dijiye."}
    terminal: {en: "That request is closed.", hinglish: "Woh request band ho chuki hai."}
messages_extra:
  whatsapp_followup:
    en: "Thanks for your call. To continue I need one more detail. {question}"
    hinglish: "Call ke liye shukriya. Aage badhne ke liye ek detail chahiye. {question}"
