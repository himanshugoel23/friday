# Timelines for scenarios S1-S8 (invented). `at` = minutes after `start` (IST). Each step ingests ONE event at that
# time, as the phone would. Run in LIVE mode (shadow_days 0) and in SHADOW mode (7 days) by test_scenarios.py.
#   logged: [scenario, highest tier the engine logs for it]      (null = must not appear)
#   alerts: ordered child-alert tiers for that scenario (live only)
#   prompt: copy key of the parent nudge the live run must create (null = none)
