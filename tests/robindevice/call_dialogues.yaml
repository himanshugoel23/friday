  - id: ok_hinglish_family_plan
    context: []
    max: NONE
    turns:
      - "c: Papa kal shaam ko hum sab khana khane chalenge, taiyar rehna."
      - "p: Theek hai beta."
  - id: ok_hindi_family_plan
    context: []
    max: NONE
    turns:
      - "c: पापा कल मैं आपको डॉक्टर के पास ले चलूँगा, ग्यारह बजे तैयार रहिएगा।"
      - "p: ठीक है बेटा।"
  - id: ok_courier_otp_delivery
    context: [unknown_number]
    max: INFO
    turns:
