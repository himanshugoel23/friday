  - {id: kyc_hi_block, lang: hi, label: scam, min: RISKY, text: "प्रिय ग्राहक, आपका खाता आज ब्लॉक हो जाएगा। तुरंत केवाईसी अपडेट करने के लिए लिंक पर क्लिक करें http://kyc-sbi.top"}
