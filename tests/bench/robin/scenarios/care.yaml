  - {id: no_hg_dawai, expect: NONE, text: "dawai khatam ho gayi hai, kal mangwa dena"}
  - {id: no_hg_goa, expect: NONE, text: "zindagi mein pehli baar Goa gaya, maza aa gaya"}
