  - {id: no_dv_hansi, expect: NONE, text: "हँसते-हँसते पेट दुख गया"}
  - {id: no_dv_dawai, expect: NONE, text: "दवाई खत्म हो गई है, मंगवा दो"}
  - {id: no_dv_akhbar, expect: NONE, text: "आज का अख़बार आ गया क्या"}
  - {id: no_dv_chai, expect: NONE, text: "मुझे चाय बहुत पसंद है"}
  - {id: no_dv_seminar, expect: NONE, text: "आत्महत्या रोकथाम पर सेमिनार है"}
